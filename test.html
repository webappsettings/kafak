<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafak Premium Reveal</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            /* Applied Global Font */
        }

        .video-wrapper {
            position: relative;
            width: 320px;
            height: 576px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            background: #000;
            border: 2px solid #333;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 🏷️ ROUND LABEL */
        .digital-label {
            position: absolute;
            top: 67%;
            left: 53%;
            transform: translate(-30%, -50%) scale(0.7);

            width: 128px;
            height: 128px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 40%, #ffe6a0 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .digital-label.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .content-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s ease-in-out;
        }

        .digital-label img {
            width: 60px;
            opacity: 0.95;
            margin-bottom: 2px;
        }

        /* 🔥 UPDATED FONT FOR 'RESERVED FOR' */
        .packed-text {
            font-family: 'Montserrat', sans-serif;
            /* Premium Font */
            font-size: 9px;
            color: #5d4037;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            /* Bold */
            margin-top: 2px;
        }

        /* Move Up Adjustment */
        .digital-label.final-state .content-group {
            transform: translateY(-18px) scale(0.9);
        }

        /* 🔥 TICK MARK */
        .check-wrapper {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .check-wrapper.show {
            transform: translateX(-50%) scale(1);
        }

        .checkmark-svg {
            width: 28px;
            height: 28px;
            stroke: #28a745;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            transition: stroke-dashoffset 0.4s ease-in-out;
        }

        .check-wrapper.draw .checkmark-svg {
            stroke-dashoffset: 0;
        }

        /* 🔥 NAME BADGE (BLACK STYLE) */
        .name-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 999;
            transform: translate(-100%, -250%) scale(1.2);
            opacity: 0;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .user-name {
            /* Using Courier New for Name to keep 'Typewriter' feel, 
               OR change to 'Montserrat' if you want it modern */
            font-family: 'Courier New', monospace;
            font-size: 25px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            padding-bottom: 2px;
            background-color: #000000;

            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;

            width: auto;
            min-width: 163px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 2px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .name-wrapper.show-big {
            opacity: 1;
            transform: translate(-50%, -250%) scale(1.2);
        }

        .name-wrapper.docked {
            top: 67%;
            left: 53%;
            transform: translate(-50%, 2px) scale(0.5);
            opacity: 1;
        }

        .status-txt {
            color: #d4a017;
            margin-top: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="video-wrapper">
        <video id="honeyVideo" muted playsinline preload="auto">
            <source src="honey_rotate.mp4" type="video/mp4">
        </video>

        <div class="digital-label" id="mainLabel">
            <div class="content-group">
                <img src="kafak_logo.png" alt="Kafak">
                <div class="packed-text">RESERVED FOR</div>
            </div>

            <div class="check-wrapper" id="finalCheck">
                <svg class="checkmark-svg" viewBox="0 0 24 24">
                    <path d="M4 12l5 5L20 6"></path>
                </svg>
            </div>
        </div>

        <div class="name-wrapper" id="nameBadge">
            <div class="user-name" id="vid-username"></div>
        </div>
    </div>

    <div class="status-txt" id="statusText">TAP TO TEST</div>

    <script>
        $(document).click(function () {
            const video = document.getElementById('honeyVideo');
            const label = $('#mainLabel');
            const nameBadge = $('#nameBadge');
            const checkWrapper = $('#finalCheck');
            const txt = $('#statusText');
            const nameBox = document.getElementById('vid-username');

            // TEST NAME
            const userName = "Alexander Disoosa Peter";

            // RESET
            label.removeClass('visible final-state');
            nameBadge.removeClass('show-big docked');
            checkWrapper.removeClass('show draw');
            nameBox.innerText = "";
            txt.text("STARTING...");

            // Font Logic
            let fontSize = 25;
            if (userName.length > 20) fontSize = 16;
            else if (userName.length > 12) fontSize = 20;
            $('#vid-username').css('font-size', fontSize + 'px');

            video.currentTime = 0;
            video.play();

            // 1. Label Appears
            setTimeout(() => { label.addClass('visible'); }, 4700);

            // 2. Name Slides In
            setTimeout(() => { nameBadge.addClass('show-big'); }, 5500);

            // 3. Typewriter
            setTimeout(() => {
                let i = 0;
                let text = userName.replace(/ /g, "\u00A0");
                nameBox.innerText = "";
                let typeInterval = setInterval(() => {
                    if (i < text.length) { nameBox.innerText += text.charAt(i); i++; }
                    else { clearInterval(typeInterval); }
                }, 80);
                txt.text("TYPING...");
            }, 5800);

            // 4. Zoom Out & Dock
            setTimeout(() => {
                nameBadge.removeClass('show-big').addClass('docked');
                label.addClass('final-state');
                txt.text("FINISHING...");
            }, 7800);

            // 5. Tick Animation
            setTimeout(() => {
                checkWrapper.addClass('show');
                setTimeout(() => { checkWrapper.addClass('draw'); }, 100);
                txt.text("DONE! ✅");
            }, 8300);
        });
    </script>

</body>

</html>
