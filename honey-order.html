<!DOCTYPE html>
<html>
<head>
  <title>Honey Order Form</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      padding: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 2px solid #f9a825;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f9a825;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    h2 {
      text-align: center;
      color: #f57f17;
    }
    #response {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Order Pure Honey</h2>
  <form id="honeyForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <textarea name="address" placeholder="Delivery Address" required></textarea>
    <input type="number" name="quantity" placeholder="Quantity (in grams/ml)" required>
    <textarea name="message" placeholder="Any special instructions?"></textarea>
    <button type="submit">Place Order</button>
    <p id="response"></p>
  </form>

  <script src="jquery-3.6.1.min.js"></script>

  <script>
  const form = document.getElementById('honeyForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => data[key] = value);
    finalData = JSON.stringify(data);
    console.log('finalData=', finalData)

    fetch("https://script.google.com/macros/s/AKfycbx2Rz0nqhGRci_K50XxqNcJ2g2FoQshh8uEHfIQc5YzvKLoSuO7nzIOfre4v2_OhFhSbw/exec", {
      method: "POST",
      body: finalData,
      headers: {
        "Content-Type": "application/json"
      }
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById("response").innerText = "Order submitted successfully!";
      form.reset();
    })
    .catch(error => {
      document.getElementById("response").innerText = "Something went wrong. Try again!";
      console.error("Error:", error);
    });
  });
</script>

</body>
</html>
