<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kafak Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #eef2f5;
            font-family: 'Poppins', sans-serif;
        }

        /* LOGIN STYLE */
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .btn-login {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        /* DASHBOARD STYLE */
        #dashboard-section {
            display: none;
            padding-bottom: 100px;
        }

        .navbar {
            background: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            padding: 15px 0;
        }

        .navbar-brand {
            font-weight: 800;
            color: #1b5e20 !important;
            font-size: 20px;
        }

        /* 🔴 BEAUTIFUL CARD DESIGN */
        .order-card {
            border: none;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .order-card:active {
            transform: scale(0.99);
        }

        .card-header-custom {
            background: linear-gradient(to right, #f1f8e9, #fff);
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-weight: 700;
            color: #37474f;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .card-body-custom {
            padding: 20px;
        }

        .customer-name {
            font-size: 17px;
            font-weight: 700;
            color: #263238;
            margin-bottom: 2px;
        }

        .customer-phone {
            font-size: 13px;
            color: #78909c;
            font-weight: 500;
            margin-bottom: 15px;
            display: block;
        }

        .order-details-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #eef2f3;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .detail-label {
            color: #90a4ae;
            font-size: 12px;
        }

        .detail-value {
            font-weight: 600;
            color: #455a64;
        }

        .price-value {
            color: #2e7d32;
            font-weight: 700;
        }

        .address-text {
            font-size: 13px;
            color: #546e7a;
            line-height: 1.5;
            margin-top: 10px;
            border-top: 1px dashed #cfd8dc;
            padding-top: 10px;
        }

        /* Badges */
        .status-badge {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bg-pending {
            background-color: #fff8e1;
            color: #fbc02d;
        }

        .bg-dispatched {
            background-color: #e1f5fe;
            color: #039be5;
        }

        .bg-completed {
            background-color: #e8f5e9;
            color: #43a047;
        }

        /* Buttons */
        .btn-action {
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px;
            border: none;
        }

        .btn-whatsapp {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .btn-print {
            background: #eceff1;
            color: #455a64;
        }

        .btn-whatsapp:active,
        .btn-print:active {
            filter: brightness(0.95);
        }

        /* Floating Button */
        .fab-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 10px;
            border-radius: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .btn-scan-fab {
            border-radius: 30px;
            height: 50px;
            font-weight: 700;
            border: none;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scan-dispatch {
            background: #2e7d32;
            color: white;
        }

        .scan-tracking {
            background: #e53935;
            color: white;
        }

        /* Modal */
        #scanner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div id="login-section" class="login-container">
        <div class="login-card">
            <h1 style="font-size: 50px; margin-bottom: 10px;">🍯</h1>
            <h4 style="font-weight:700; color:#2e7d32; margin-bottom: 5px;">Admin Portal</h4>
            <p class="text-muted small mb-4">Secure Login</p>

            <div class="mb-3 text-start">
                <label class="form-label small fw-bold text-muted">Username</label>
                <input type="text" id="adminUser" class="form-control form-control-lg" placeholder="Enter username">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold text-muted">Password</label>
                <input type="password" id="adminPass" class="form-control form-control-lg" placeholder="••••••">
            </div>
            <button class="btn-login" onclick="attemptLogin()" id="loginBtn">ACCESS DASHBOARD</button>
            <p id="loginMsg" class="text-danger small mt-3 fw-bold"></p>
        </div>
    </div>

    <div id="dashboard-section">
        <nav class="navbar sticky-top">
            <div class="container">
                <span class="navbar-brand">🍯 KAFAK Admin</span>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-success rounded-pill px-3" onclick="loadOrders()">Sync
                        🔄</button>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="logout()">Exit</button>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div id="loader" class="text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-2 text-muted small fw-bold">Fetching Orders...</p>
            </div>
            <div id="order-list" class="row"></div>
        </div>

        <div class="fab-container">
            <div class="d-flex gap-2 w-100">
                <button class="btn-scan-fab scan-dispatch flex-grow-1" onclick="startScanner('dispatch')">📦
                    Dispatch</button>
                <button class="btn-scan-fab scan-tracking flex-grow-1" onclick="startScanner('tracking')">🚚
                    Tracking</button>
            </div>
        </div>
    </div>

    <div id="scanner-modal">
        <button onclick="stopScanner()"
            style="position:absolute; top:30px; right:30px; background:white; border:none; width:40px; height:40px; border-radius:50%; font-weight:bold;">✕</button>
        <div class="text-center mb-4">
            <h4 id="scan-instruction" class="text-white fw-bold">Scanning...</h4>
            <p id="scan-detail" class="text-white-50 small">Align QR code within frame</p>
        </div>
        <div id="reader"></div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="admin.js"></script>
</body>

</html>
