<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFAK Admin | Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 80px;
        }

        /* NAVBAR & TABS */
        .navbar {
            background: #1b5e20;
            padding: 10px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-tabs {
            background: white;
            padding: 10px 10px 0;
            border-bottom: none;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .nav-link {
            color: #555;
            font-weight: 600;
            border: none !important;
            border-bottom: 3px solid transparent !important;
        }

        .nav-link.active {
            color: #1b5e20 !important;
            border-bottom: 3px solid #1b5e20 !important;
            background: none !important;
        }

        .badge-count {
            font-size: 10px;
            position: relative;
            top: -2px;
            margin-left: 5px;
        }

        /* CARD DESIGN */
        .order-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            position: relative;
            border-left: 5px solid #ccc;
        }

        .order-card.status-Paid {
            border-left-color: #ffc107;
        }

        /* Yellow for Paid */
        .order-card.status-Dispatched {
            border-left-color: #198754;
            background: #f0fff4;
        }

        /* Green for Dispatched */

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .order-id {
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #333;
        }

        .date-text {
            font-size: 0.75rem;
            color: #888;
        }

        .cust-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #000;
        }

        .cust-details {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }

        .state-badge {
            background: #e3f2fd;
            color: #0d47a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 8px;
            margin: 10px 0;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        /* Buttons */
        .action-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-custom {
            flex: 1;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 8px;
            border: none;
        }

        .btn-wa {
            background: #dcfce7;
            color: #14532d;
        }

        .btn-paid {
            background: #fff3cd;
            color: #856404;
        }

        .btn-dispatch {
            background: #d1e7dd;
            color: #0f5132;
        }

        .btn-track {
            background: #cff4fc;
            color: #055160;
        }

        .btn-remove {
            background: #f8d7da;
            color: #721c24;
            max-width: 40px;
        }

        /* Scanner Modal */
        #scanner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            background: black;
        }

        /* Print Area (A6) */
        #print-area {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #print-area,
            #print-area * {
                visibility: visible;
            }

            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A6;
                margin: 0;
            }

            .label-page {
                width: 105mm;
                height: 148mm;
                background: white;
                padding: 5mm;
                page-break-after: always;
                display: flex;
                flex-direction: column;
                font-family: Arial, sans-serif;
                box-sizing: border-box;
                border: 1px dashed #ccc;
            }

            .header-sec {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 5px;
            }

            .barcode-box svg {
                height: 35px;
                width: 100%;
            }

            .qr-box {
                width: 50px;
                height: 50px;
            }

            .cust-details-print {
                font-size: 16px;
                font-weight: 800;
                text-transform: uppercase;
                line-height: 1.2;
                color: #000;
            }

            .footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                border-top: 1px solid #eee;
                padding-top: 5px;
            }

            .from-sec {
                text-align: right;
                font-size: 10px;
                font-weight: 600;
                line-height: 1.3;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar d-flex justify-content-between align-items-center">
        <span class="text-white fw-bold h5 mb-0"><i class="fas fa-boxes"></i> KAFAK Admin</span>
        <div>
            <button class="btn btn-sm btn-outline-light" onclick="printSelected()"><i class="fas fa-print"></i>
                Print</button>
            <button class="btn btn-sm btn-outline-light" onclick="fetchOrders()"><i class="fas fa-sync"></i></button>
        </div>
    </nav>

    <ul class="nav nav-tabs sticky-top" id="orderTabs" role="tablist">
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link active w-100" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending"
                type="button" role="tab">
                New <span id="count-pending" class="badge bg-danger badge-count">0</span>
            </button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100" id="paid-tab" data-bs-toggle="tab" data-bs-target="#paid" type="button"
                role="tab">
                Paid <span id="count-paid" class="badge bg-warning text-dark badge-count">0</span>
            </button>
        </li>
        <li class="nav-item flex-fill text-center" role="presentation">
            <button class="nav-link w-100" id="dispatched-tab" data-bs-toggle="tab" data-bs-target="#dispatched"
                type="button" role="tab">
                Sent <span id="count-dispatched" class="badge bg-success badge-count">0</span>
            </button>
        </li>
    </ul>

    <div class="container-fluid mt-3 tab-content">

        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Loading...</p>
        </div>

        <div class="tab-pane fade show active" id="pending" role="tabpanel">
            <div id="list-pending" class="row"></div>
        </div>

        <div class="tab-pane fade" id="paid" role="tabpanel">
            <div class="d-grid gap-2 mb-3">
                <button class="btn btn-success fw-bold" onclick="startScanner('dispatch')">
                    <i class="fas fa-qrcode"></i> Scan to Dispatch
                </button>
            </div>
            <div id="list-paid" class="row"></div>
        </div>

        <div class="tab-pane fade" id="dispatched" role="tabpanel">
            <div class="d-grid gap-2 mb-3">
                <button class="btn btn-primary fw-bold" onclick="startScanner('tracking')">
                    <i class="fas fa-barcode"></i> Scan Tracking
                </button>
            </div>
            <div id="list-dispatched" class="row"></div>
        </div>

    </div>

    <div id="scanner-modal">
        <h3 id="scan-instruction" class="text-white text-center fw-bold">Scan QR</h3>
        <div id="reader"></div>
        <button class="btn btn-light mt-4 rounded-pill px-4 fw-bold" onclick="stopScanner()">CLOSE</button>
    </div>

    <div id="print-area"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>

</body>

</html>
