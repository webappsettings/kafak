<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFAK Admin | Manage Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #2e7d32;
            color: white;
        }

        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
        }

        /* --- A6 PRINT DESIGN (Based on your Image) --- */
        @media print {
            body * {
                visibility: hidden;
            }

            #print-area,
            #print-area * {
                visibility: visible;
            }

            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A6;
                margin: 0;
            }

            /* Set Paper Size to A6 */

            .print-page {
                width: 105mm;
                height: 148mm;
                padding: 10mm;
                position: relative;
                background: white;
                page-break-after: always;
                /* Force new page for each label */
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            .to-section {
                flex-grow: 1;
            }

            .to-label {
                font-size: 18px;
                font-weight: 800;
                margin-bottom: 5px;
            }

            .cust-name {
                font-size: 20px;
                font-weight: 800;
                text-transform: uppercase;
                line-height: 1.2;
            }

            .cust-address {
                font-size: 15px;
                font-weight: 600;
                text-transform: uppercase;
                line-height: 1.3;
                margin-top: 5px;
            }

            .phone-box {
                border: 2px solid #333;
                border-radius: 10px;
                padding: 5px 10px;
                margin-top: 15px;
                display: inline-flex;
                align-items: center;
                gap: 10px;
                background: #fff;
            }

            .phone-icon {
                font-size: 24px;
            }

            .phone-numbers {
                font-size: 16px;
                font-weight: 800;
            }

            .footer-section {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                margin-top: auto;
                padding-top: 10px;
            }

            .fragile-icon {
                color: #d32f2f;
                text-align: center;
                font-weight: bold;
                font-size: 12px;
            }

            .fragile-svg {
                width: 50px;
                height: 60px;
                fill: #d32f2f;
            }

            .from-address {
                font-size: 11px;
                font-weight: 600;
                text-align: right;
                width: 60%;
                line-height: 1.3;
            }
        }

        /* Hide Print Area on Screen */
        #print-area {
            display: none;
        }

        @media print {
            #print-area {
                display: block;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark p-3 mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">KAFAK Admin Panel 🍯</span>
            <button class="btn btn-light btn-sm fw-bold" onclick="printSelected()">🖨️ Print Selected Labels</button>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Location</th>
                            <th>Contact Mode</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody">
                        <tr>
                            <td colspan="7" class="text-center p-3">Loading Orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="print-area"></div>

    <script>
        // 🔴 UPDATE YOUR SCRIPT URL HERE
        const scriptURL = "https://script.google.com/macros/s/AKfycby_1PorN19SVT-nghojK6v6Qv0vdUUAJx9v5rXlDuQw1ruPXIRTaC-ymjhYGjOszGDkRw/exec";

        let allOrders = [];

        // Load Orders on Page Load
        fetch(`${scriptURL}?action=getAllOrders`)
            .then(res => res.json())
            .then(response => {
                if (response.result === 'success') {
                    allOrders = response.data;
                    renderTable(allOrders);
                } else {
                    alert("Failed to load orders");
                }
            });

        function renderTable(orders) {
            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            orders.forEach((order, index) => {
                // Formatting Date
                let dateObj = new Date(order.timestamp);
                let dateStr = dateObj.toLocaleDateString('en-IN');

                let row = `
                <tr>
                    <td><input type="checkbox" class="order-checkbox" value="${index}"></td>
                    <td><span class="badge bg-secondary">${order.orderid}</span></td>
                    <td class="small">${dateStr}</td>
                    <td>
                        <div class="fw-bold">${order.name}</div>
                        <div class="small text-muted">${order.phone}</div>
                    </td>
                    <td class="small">${order.place}, ${order.district}</td>
                    
                    <td>
                        <select class="form-select form-select-sm" id="contact-select-${index}" style="width: 140px;">
                            <option value="${order.whatsapp}">WhatsApp (${order.whatsapp})</option>
                            <option value="${order.phone}">Phone (${order.phone})</option>
                        </select>
                    </td>

                    <td>
                        <button class="btn btn-success btn-sm" onclick="sendWhatsApp(${index})">
                            <i class="fab fa-whatsapp"></i> Send
                        </button>
                    </td>
                </tr>
            `;
                tbody.innerHTML += row;
            });
        }

        // --- SEND WHATSAPP LOGIC ---
        function sendWhatsApp(index) {
            const order = allOrders[index];

            // 🔴 Get the selected number from Dropdown
            const selectedNumber = document.getElementById(`contact-select-${index}`).value;

            // Message Content
            const msg = `Hi ${order.name}, your order for Kafak Honey is packed! 🍯\nID: ${order.orderid}\nWe will ship it soon.`;

            // Open WhatsApp
            window.open(`https://wa.me/91${selectedNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- BULK PRINT LOGIC (A6 BEAUTIFUL) ---
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            const selectAll = document.getElementById('selectAll');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
        }

        function printSelected() {
            const checkboxes = document.querySelectorAll('.order-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("Please select at least one order to print!");
                return;
            }

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = ''; // Clear previous

            checkboxes.forEach(cb => {
                const index = cb.value;
                const order = allOrders[index];
                const labelHTML = createA6Label(order);
                printArea.innerHTML += labelHTML;
            });

            window.print();
        }

        // --- GENERATE LABEL HTML (Matches your Image) ---
        function createA6Label(d) {
            // Handle undefined postoffice
            let poText = d.postoffice ? `${d.postoffice},` : '';

            return `
            <div class="print-page">
                <div class="to-section">
                    <div class="to-label">To,</div>
                    <div class="cust-name">${d.name}</div>
                    <div class="cust-address">
                        ${d.house}<br>
                        ${d.place}, ${poText}<br>
                        ${d.district}, KERALA<br>
                        PIN: ${d.pincode}
                    </div>
                    
                    <div class="phone-box">
                        <span class="phone-icon">📞</span>
                        <div class="phone-numbers">
                            ${d.phone}${d.whatsapp && d.whatsapp !== d.phone ? ', ' + d.whatsapp : ''}
                        </div>
                    </div>
                </div>

                <div class="footer-section">
                    <div class="fragile-icon">
                        <svg class="fragile-svg" viewBox="0 0 24 24">
                            <path d="M18.1,5.1c0,0-2.2-2.8-2.6-3.2C15.1,1.5,14.6,1.2,14,1.2h-4c-0.6,0-1.1,0.3-1.5,0.7C8.1,2.3,5.9,5.1,5.9,5.1 C5.3,5.8,5,6.7,5,7.6v5.8c0,1.9,1.1,3.6,2.8,4.4v3h-1v2h10.4v-2h-1v-3c1.7-0.8,2.8-2.5,2.8-4.4V7.6C19,6.7,18.7,5.8,18.1,5.1z M10.4,4.2L11,3.5l3.5,6l0.9-0.5L11.5,2.5l0.9-0.5l0.5,0.9l-0.9,0.5L12.5,4l0.6-0.8L10.4,4.2z"/>
                            <path d="M12,14L12,14c-0.6,0-1-0.4-1-1v-2l-2,3.5l-0.9-0.5L10,10.6L8.8,12.7L7.9,12.2l2-3.5L9,7.3l2.5,4.3l0.9-0.5l-2-3.5 L12,5l1.6,2.7l-2,3.5l0.9,0.5l2.5-4.3l-0.9-1.5l2-3.5l0.9,0.5L15.1,6L14,8v5C14,13.6,13.6,14,12,14z"/>
                        </svg>
                        <br>FRAGILE
                    </div>

                    <div class="from-address">
                        From,<br>
                        KAFAK LLP, 10/174, Kunnathery,<br>
                        Thaikkattukara P.O, Aluva - 683106,<br>
                        Ernakulam District, Kerala, India.<br>
                        Phone: 778899 0 313
                    </div>
                </div>
            </div>
        `;
        }
    </script>

</body>

</html>
