<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFAK Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            padding-bottom: 80px;
        }

        /* NAVBAR */
        .navbar {
            background: #1b5e20;
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .btn-print-nav {
            background: white;
            color: #1b5e20;
            font-weight: bold;
            border: none;
        }

        /* SEARCH BAR */
        .search-container {
            background: white;
            padding: 15px;
            position: sticky;
            top: 60px;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* CARD DESIGN (Restored Old Style) */
        .order-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #1b5e20;
            /* Green accent */
            transition: all 0.2s;
        }

        .order-card.selected {
            background-color: #e8f5e9;
            border: 1px solid #1b5e20;
            border-left: 5px solid #1b5e20;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .badge-id {
            background: #eee;
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .date-text {
            font-size: 0.8rem;
            color: #777;
        }

        .cust-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #000;
        }

        .cust-place {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
        }

        .action-area {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        /* CHECKBOX STYLE */
        .custom-check {
            transform: scale(1.3);
            margin-right: 10px;
            cursor: pointer;
        }

        /* LOADING */
        #loader {
            text-align: center;
            padding: 40px;
        }

        /* --- PRINT STYLES (A6 + Barcode + QR) --- */
        @media print {
            body * {
                visibility: hidden;
            }

            #print-area,
            #print-area * {
                visibility: visible;
            }

            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A6;
                margin: 0;
            }

            .label-page {
                width: 105mm;
                height: 148mm;
                background: white;
                padding: 5mm;
                position: relative;
                box-sizing: border-box;
                page-break-after: always;
                display: flex;
                flex-direction: column;
                font-family: Arial, sans-serif;
                border: 1px dashed #ccc;
                /* Cut guide */
            }

            /* Header Section */
            .header-sec {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 5px;
            }

            .barcode-box svg {
                height: 35px;
                width: 100%;
            }

            .qr-box {
                width: 50px;
                height: 50px;
            }

            .qr-box img {
                width: 100%;
            }

            /* To Address */
            .to-label {
                font-size: 14px;
                font-weight: bold;
                margin-bottom: 2px;
            }

            .cust-details {
                font-size: 16px;
                font-weight: 800;
                text-transform: uppercase;
                line-height: 1.2;
                color: #000;
            }

            .cust-pin {
                font-size: 16px;
                font-weight: 900;
                margin-top: 2px;
            }

            /* Phone Box */
            .phone-display {
                margin-top: 8px;
                border: 2px solid #000;
                border-radius: 6px;
                padding: 4px 8px;
                display: inline-block;
                font-weight: 900;
                font-size: 16px;
            }

            /* Support Box */
            .support-box {
                margin-top: 8px;
                border: 1px solid #777;
                border-radius: 6px;
                padding: 4px;
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 10px;
                font-weight: 700;
                width: fit-content;
            }

            .support-icon {
                font-size: 18px;
            }

            /* Footer */
            .footer {
                margin-top: auto;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                border-top: 1px solid #eee;
                padding-top: 5px;
            }

            .fragile-icon {
                text-align: center;
                color: #d32f2f;
            }

            .fragile-svg {
                width: 40px;
                fill: #d32f2f;
            }

            .fragile-text {
                font-weight: 900;
                font-size: 12px;
                letter-spacing: 1px;
            }

            .from-sec {
                text-align: right;
                font-size: 10px;
                font-weight: 600;
                line-height: 1.3;
            }
        }

        #print-area {
            display: none;
        }
    </style>
</head>

<body>

    <nav class="navbar d-flex justify-content-between">
        <span class="navbar-brand mb-0 h1 fw-bold"><i class="fas fa-boxes"></i> KAFAK Orders</span>
        <button class="btn btn-print-nav btn-sm shadow" onclick="printSelected()">
            <i class="fas fa-print"></i> Print Labels
        </button>
    </nav>

    <div class="search-container">
        <div class="row align-items-center">
            <div class="col-12 col-md-8 mb-2 mb-md-0">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search Name, Phone or ID..."
                    onkeyup="filterOrders()">
            </div>
            <div class="col-12 col-md-4 d-flex align-items-center">
                <input type="checkbox" id="selectAll" class="custom-check" onchange="toggleAll(this.checked)">
                <label for="selectAll" class="fw-bold text-muted">Select All</label>
                <button class="btn btn-outline-secondary btn-sm ms-auto" onclick="location.reload()">Refresh 🔄</button>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-3">
        <div id="loader">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted">Fetching Orders...</p>
        </div>
        <div id="ordersContainer" class="row"></div>
    </div>

    <div id="print-area"></div>

    <script>
        // 🔴 PASTE YOUR DEPLOYMENT URL HERE
        const scriptURL = "https://script.google.com/macros/s/AKfycby_1PorN19SVT-nghojK6v6Qv0vdUUAJx9v5rXlDuQw1ruPXIRTaC-ymjhYGjOszGDkRw/exec";

        let allOrders = [];

        // 1. Fetch Orders
        fetch(`${scriptURL}?action=getAllOrders`)
            .then(res => res.json())
            .then(response => {
                document.getElementById('loader').style.display = 'none';
                if (response.result === 'success') {
                    allOrders = response.data;
                    renderOrders(allOrders);
                } else {
                    alert('Error: ' + response.message);
                }
            })
            .catch(err => alert("Network Error: " + err));

        // 2. Render Cards (Old Style)
        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            orders.forEach((d, i) => {
                let date = new Date(d.timestamp).toLocaleDateString('en-IN');

                let btnClass = d.Status === 'Sent' ? 'btn-secondary' : 'btn-success';
                let btnText = d.Status === 'Sent' ? 'Sent ✅' : '<i class="fab fa-whatsapp"></i> Send Message';

                let html = `
                <div class="col-12 col-md-6 col-lg-4 mb-3">
                    <div class="order-card p-3" id="card-${i}">
                        <div class="card-top">
                            <span class="badge-id">${d.orderid}</span>
                            <span class="date-text">${date}</span>
                        </div>
                        
                        <div class="d-flex align-items-start">
                            <input type="checkbox" class="custom-check mt-1 order-cb" value="${i}" onchange="highlightCard(${i}, this.checked)">
                            <div class="w-100 ms-2">
                                <div class="cust-name">${d.name}</div>
                                <div class="cust-place">${d.place}, ${d.district}</div>
                                <div class="fw-bold text-dark mb-1">Items: ${d.quantity} Bottle(s)</div>

                                <div class="action-area">
                                    <div class="input-group input-group-sm mb-2">
                                        <span class="input-group-text bg-white">Send To:</span>
                                        <select class="form-select" id="contact-${i}">
                                            <option value="${d.whatsapp}">WhatsApp (${d.whatsapp})</option>
                                            <option value="${d.phone}">Phone (${d.phone})</option>
                                        </select>
                                    </div>
                                    <button class="btn btn-sm ${btnClass} w-100 fw-bold" 
                                        onclick="sendWA(${i}, this)">${btnText}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        // 3. Selection & Filtering
        function toggleAll(checked) {
            document.querySelectorAll('.order-cb').forEach(cb => {
                cb.checked = checked;
                highlightCard(cb.value, checked);
            });
        }

        function highlightCard(index, checked) {
            const card = document.getElementById(`card-${index}`);
            if (checked) card.classList.add('selected');
            else card.classList.remove('selected');
        }

        function filterOrders() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allOrders.filter(o =>
                o.name.toLowerCase().includes(term) ||
                String(o.phone).includes(term) ||
                String(o.orderid).toLowerCase().includes(term)
            );
            renderOrders(filtered);
        }

        // 4. Send WhatsApp
        function sendWA(index, btn) {
            const order = allOrders[index];
            const phone = document.getElementById(`contact-${index}`).value;
            const msg = `Hi ${order.name}, your order (${order.orderid}) is packed! 🍯\nWe will ship it soon.`;

            window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');

            btn.className = 'btn btn-secondary btn-sm w-100 fw-bold';
            btn.innerText = 'Sent ✅';

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'updateStatus', oid: order.orderid, status: 'Sent' })
            });
        }

        // 5. PRINT LOGIC (With Barcode & QR)
        function printSelected() {
            const selected = document.querySelectorAll('.order-cb:checked');
            if (selected.length === 0) {
                alert("Please select orders to print!");
                return;
            }

            const area = document.getElementById('print-area');
            area.innerHTML = '';

            // Generate HTML for each label
            selected.forEach(cb => {
                const idx = cb.value;
                const d = allOrders[idx];
                area.innerHTML += createLabelHTML(d, idx);
            });

            // Wait a moment for DOM update, then Generate Codes, then Print
            setTimeout(() => {
                selected.forEach(cb => {
                    const idx = cb.value;
                    const d = allOrders[idx];

                    // 1. Generate Barcode (Order ID)
                    JsBarcode(`#barcode-${idx}`, d.orderid, {
                        format: "CODE128",
                        height: 30,
                        displayValue: false,
                        margin: 0
                    });

                    // 2. Generate QR Code (Google Maps Search)
                    const mapLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.place + ',' + d.district)}`;
                    new QRCode(document.getElementById(`qrcode-${idx}`), {
                        text: mapLink,
                        width: 50,
                        height: 50
                    });
                });

                // Trigger Print
                setTimeout(() => window.print(), 500);
            }, 100);
        }

        function createLabelHTML(d, idx) {
            let po = d.postoffice ? `${d.postoffice}` : '';
            return `
            <div class="label-page">
                <div class="header-sec">
                    <div id="qrcode-${idx}" class="qr-box"></div>
                    <svg id="barcode-${idx}" class="barcode-box"></svg>
                </div>

                <div class="to-label">To,</div>
                <div class="cust-details">
                    ${d.name}<br>
                    ${d.house}<br>
                    ${d.place} ${po ? ',' + po : ''}<br>
                    ${d.district}, KERALA
                </div>
                <div class="cust-pin">PIN: ${d.pincode}</div>
                
                <div class="phone-display">PH: ${d.phone}</div>

                <div class="support-box">
                    <div class="support-icon">📞</div>
                    <div>
                        7788990313, 9895082689<br>
                        If unreachable, call or WhatsApp us
                    </div>
                </div>

                <div class="footer">
                    <div class="fragile-icon">
                        <svg class="fragile-svg" viewBox="0 0 24 24">
                            <path d="M18.1,5.1c0,0-2.2-2.8-2.6-3.2C15.1,1.5,14.6,1.2,14,1.2h-4c-0.6,0-1.1,0.3-1.5,0.7C8.1,2.3,5.9,5.1,5.9,5.1 C5.3,5.8,5,6.7,5,7.6v5.8c0,1.9,1.1,3.6,2.8,4.4v3h-1v2h10.4v-2h-1v-3c1.7-0.8,2.8-2.5,2.8-4.4V7.6C19,6.7,18.7,5.8,18.1,5.1z M10.4,4.2L11,3.5l3.5,6l0.9-0.5L11.5,2.5l0.9-0.5l0.5,0.9l-0.9,0.5L12.5,4l0.6-0.8L10.4,4.2z"/><path d="M12,14L12,14c-0.6,0-1-0.4-1-1v-2l-2,3.5l-0.9-0.5L10,10.6L8.8,12.7L7.9,12.2l2-3.5L9,7.3l2.5,4.3l0.9-0.5l-2-3.5 L12,5l1.6,2.7l-2,3.5l0.9,0.5l2.5-4.3l-0.9-1.5l2-3.5l0.9,0.5L15.1,6L14,8v5C14,13.6,13.6,14,12,14z"/>
                        </svg>
                        <div class="fragile-text">FRAGILE</div>
                    </div>
                    <div class="from-sec">
                        From,<br>
                        KAFAK LLP, 10/174, Kunnathery,<br>
                        Thaikkattukara P.O, Aluva - 683106,<br>
                        Ernakulam District, Kerala, India.<br>
                        Phone: 778899 0 313
                    </div>
                </div>
            </div>`;
        }
    </script>

</body>

</html>
