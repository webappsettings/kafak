<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAFAK Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --brand-green: #2e7d32;
            --light-bg: #f2f4f6;
        }

        body {
            background: var(--light-bg);
            font-family: 'Manrope', sans-serif;
            padding-bottom: 80px;
        }

        /* NAVBAR */
        .navbar {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1050;
        }

        .brand-text {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -1px;
        }

        /* 🔴 NEW STICKY HEADER SECTION */
        .sticky-header {
            position: sticky;
            top: 55px;
            /* Adjust based on navbar height */
            z-index: 1000;
            background: var(--light-bg);
            /* Match Body BG */
            padding-top: 15px;
            padding-bottom: 5px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 10px -5px rgba(0, 0, 0, 0.1);
            /* Subtle Shadow */
        }

        /* SEARCH BAR */
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 50px;
            font-weight: 600;
            outline: none;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .search-bar:focus {
            border-color: #aaa;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* TABS */
        .nav-pills {
            background: #e0e0e0;
            padding: 4px;
            border-radius: 50px;
            display: inline-flex;
        }

        .nav-pills .nav-link {
            color: #555;
            font-weight: 700;
            border-radius: 40px;
            padding: 8px 24px;
            font-size: 13px;
            transition: 0.2s;
        }

        .nav-pills .nav-link.active {
            background-color: black;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* CARD STYLE */
        .order-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s;
        }

        .status-Pending {
            border-left: 5px solid #ff9800;
        }

        .status-Paid {
            border-left: 5px solid #2e7d32;
        }

        .status-Dispatched {
            border-left: 5px solid #2196f3;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .order-id {
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        .cust-name {
            font-size: 16px;
            font-weight: 800;
            color: #222;
        }

        .cust-details {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: #444;
            border: 1px solid #eee;
        }

        .price-tag {
            color: var(--brand-green);
            font-size: 15px;
        }

        .action-area {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }

        .btn-custom {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-wa {
            background: #dcfce7;
            color: #15803d;
        }

        .btn-paid {
            background: #fef3c7;
            color: #b45309;
        }

        .btn-dispatch {
            background: #1a1a1a;
            color: white;
        }

        .btn-track {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .btn-top-action {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid #eee;
            background: white;
            color: #555;
            margin-left: 5px;
            cursor: pointer;
        }

        .btn-print-mini {
            background: #f0f0f0;
            color: #333;
            border: none;
        }

        .bottom-panel {
            text-align: center;
            margin-top: 30px;
            border-top: 1px dashed #ccc;
            padding-top: 20px;
        }

        .btn-discard {
            background: transparent;
            border: 1px solid #ffccd5;
            color: #e11d48;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 30px;
        }

        /* SCANNER */
        #scanner-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            overflow: hidden;
            background: black;
        }

        #scan-msg {
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
        }

        /* LOGIN & LOADER */
        .login-card {
            max-width: 350px;
            margin: 10vh auto;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .admin-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #f1f3f5;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            outline: none;
        }

        .btn-black-login {
            background: black;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            border: none;
        }

        #loader {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div id="login-section" style="display: flex; height:100vh; align-items:center; justify-content:center;">
        <div class="login-card">
            <h5 class="fw-bold mb-4">Admin Access</h5>
            <input type="text" id="adminUser" class="admin-input" placeholder="Username">
            <input type="password" id="adminPass" class="admin-input" placeholder="Password">
            <button onclick="attemptLogin()" class="btn-black-login">LOGIN</button>
            <p id="loginMsg" class="text-danger mt-3 small fw-bold"></p>
        </div>
    </div>

    <div id="dashboard-section" style="display: none;">
        <nav class="navbar">
            <div class="container d-flex justify-content-between">
                <span class="brand-text">KAFAK.</span>
                <button onclick="logoutAdmin()"
                    class="btn btn-sm text-danger fw-bold border-0 bg-transparent">Logout</button>
            </div>
        </nav>

        <div class="container dashboard-container" style="max-width: 800px;">

            <div class="sticky-header">
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search globally..."
                    onkeyup="filterOrders()">

                <div class="d-flex justify-content-center mb-3">
                    <button onclick="fetchOrders(true)"
                        class="btn btn-white btn-sm rounded-pill px-3 fw-bold border me-2">🔄 Refresh</button>
                    <button id="sync-btn" onclick="syncWithServer()"
                        class="btn btn-warning btn-sm rounded-pill px-4 fw-bold shadow-sm" style="display:none;">Sync
                        Updates</button>
                </div>

                <div class="text-center">
                    <div class="nav nav-pills" id="pills-tab">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-pending">New <span
                                id="count-pending" class="badge bg-dark rounded-pill ms-1">0</span></button>
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-paid">Paid <span
                                id="count-paid" class="badge bg-secondary rounded-pill ms-1">0</span></button>
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-dispatched">Dispatch <span
                                id="count-dispatched" class="badge bg-secondary rounded-pill ms-1">0</span></button>
                    </div>
                </div>
            </div>
            <div id="tabs-container">
                <div class="tab-content mt-2">
                    <div class="tab-pane fade show active" id="tab-pending">
                        <div class="row g-3" id="list-pending"></div>
                    </div>

                    <div class="tab-pane fade" id="tab-paid">
                        <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                            <button id="btn-select-all" onclick="toggleSelectAll()"
                                class="btn btn-sm btn-light fw-bold text-secondary border-0"><i
                                    class="far fa-square"></i> Select All</button>
                            <button onclick="startScanner('dispatch')"
                                class="btn btn-sm btn-dark rounded-pill px-3 fw-bold"><i class="fas fa-qrcode"></i> Scan
                                to Dispatch</button>
                            <button onclick="printSelected()"
                                class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-bold">🖨️ Print</button>
                        </div>
                        <div class="row g-3" id="list-paid"></div>
                    </div>

                    <div class="tab-pane fade" id="tab-dispatched">
                        <div class="text-center mb-4">
                            <button onclick="startScanner('tracking')"
                                class="btn btn-outline-primary rounded-pill px-4 py-2 fw-bold border-2"><i
                                    class="fas fa-barcode"></i> Scan Courier Tracking</button>
                        </div>
                        <div class="row g-3" id="list-dispatched"></div>
                    </div>
                </div>
            </div>

            <div id="search-results-area" style="display: none; padding-top:10px;">
                <h6 class="fw-bold mb-3 text-muted text-center">SEARCH RESULTS</h6>
                <div class="row g-3" id="list-search"></div>
            </div>

            <div class="bottom-panel">
                <button onclick="discardLocalChanges()" class="btn-discard"><i class="fas fa-trash-alt"></i> Discard
                    Local Changes</button>
            </div>

        </div>
    </div>

    <div id="loader" style="display:none;">
        <div class="spinner-border text-success" role="status"></div>
    </div>

    <div id="scanner-modal">
        <div id="scan-msg">Scan QR</div>
        <div style="background:white; padding:15px; border-radius:20px; width:90%; max-width:400px;">
            <div id="reader"></div>
            <button onclick="stopScanner()" class="btn btn-danger w-100 mt-3 rounded-pill fw-bold">CLOSE CAMERA</button>
        </div>
    </div>

    <style id="label-css">
        @page {
            size: A6;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: #c8c8c8;
            font-family: "Anek Malayalam", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }

        .label-page {
            width: 105mm;
            height: 147mm;
            /* A6 Size */
            position: relative;
            page-break-after: always;
            /* font-family: Arial, sans-serif; */
            font-family: 'Anek Malayalam', sans-serif;
            font-weight: 600;
            overflow: hidden;
            box-sizing: border-box;
            background: white;
            margin: 0 auto;
        }

        .label-page:last-child {
            page-break-after: auto;
        }

        /* --- 1. ADDRESS SECTION (Top Left) --- */
        .address-sec {
            position: absolute;
            top: 8mm;
            left: 8mm;
            width: 75mm;
            text-align: left;
        }

        .to-label {
            font-size: 14px;
            font-weight: 900;
            margin-bottom: 2px;
        }

        .cust-name {
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .cust-addr {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.25;
        }

        .cust-pin {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.25;
        }

        .cust-ph {
            font-size: 21px;
            font-weight: 700;
            line-height: 1;
        }

        /* --- 2. META SECTION WRAPPER (No Layout, just a wrapper) --- */
        .meta-sec {
            position: static;
        }

        /* QUANTITY (Moved to Right Side, opposite to Phone) */
        .qty-text {
            position: absolute;
            top: 12mm;
            right: 7mm;
            color: #07cbe4;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
        }

        /* QR CODE (Moved to Bottom Left) */
        .qr-box {
            position: absolute;
            bottom: 39mm;
            left: 8mm;
            width: 25mm;
            height: 25mm;
            background: white;
        }

        .qr-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ORDER ID (Below QR) */
        .qr-oid {
            position: absolute;
            bottom: 35mm;
            left: 8mm;
            width: 25mm;
            font-size: 10px;
            font-weight: 500;
            color: #000;
            text-align: center;
        }

        /* --- 3. CONTACT BOX (Middle Center) --- */
        .contact-box {
            position: absolute;
            top: 61mm;
            left: 50%;
            transform: translateX(-50%);
            width: 82mm;
            height: 15mm;
            border: 2px solid #d9d9d9;
            border-radius: 9px;
            display: block;
            background: white;
            z-index: 10;
            padding-left: 6mm;
        }

        .contact-icon svg {
            width: 30px;
            height: 30px;
            display: block;
            float: left;
            margin-top: 14px;
            padding-left: 10px;
        }

        .contact-text {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.1;
            text-align: left;
            margin: 0;
            padding-top: 12px;
            padding-left: 8px;
            float: left;
        }

        .contact-text span {
            display: block;
            font-size: 19px;
        }

        /* --- 4. FROM ADDRESS (Bottom Center - Between QR & Fragile) --- */
        .from-sec {
            position: absolute;
            bottom: 10mm;
            left: 8mm;
            width: 54mm;
            text-align: left;
            font-size: 12px;
            line-height: 1.3;
            font-weight: 600;
        }

        /* --- 5. FRAGILE ICON (Bottom Right) --- */
        .fragile-sec {
            position: absolute;
            bottom: 11mm;
            height: 53.5mm;
            right: 7mm;
            width: 32mm;
            text-align: center;
        }

        .fragile-img {
            width: 100%;
            height: 100%;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
