<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Order Form</title>
  <style>

    @media (max-width: 600px) {
  body {
    padding: 10px;
  }

  form {
    width: 100%;
    padding: 15px;
    border-width: 1px;
  }

  input, textarea, button {
    font-size: 1em;
    padding: 8px;
  }

  h2 {
    font-size: 1.2em;
  }
}


    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      padding: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 2px solid #f9a825;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f9a825;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    h2 {
      text-align: center;
      color: #f57f17;
    }
    #response {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Order Pure Honey</h2>

  <div id="g_id_onload"
     data-client_id="492781113865-4tj6p00s7kbhe8qagv66o8gbsc9ejl59.apps.googleusercontent.com"
     data-callback="onLogin"
     data-auto_prompt="false">
</div>

<div class="g_id_signin" 
     data-type="standard" 
     data-size="large">
</div>

<div id="userInfo" style="display:none;">
  <p>Welcome, <span id="userName"></span></p>
</div>

  <form id="honeyForm" style="display: none;">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <textarea name="address" placeholder="Delivery Address" required></textarea>
    <input type="number" name="quantity" placeholder="Quantity (in grams/ml)" required>
    <textarea name="message" placeholder="Any special instructions?"></textarea>
    <button type="submit">Place Order</button>
    <p id="response"></p>
  </form>

  <script src="jquery-3.6.1.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>

  <script>

    window.onload = function() {
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      console.log("User is not signed in.");
    }
    if (notification.isDisplayed()) {
      console.log("One Tap UI displayed.");
    }
    if (notification.getMomentType() === 'display') {
      console.log("Checking auto sign-in...");
    }
  });
};

    var userData;
  function onLogin(response) {
    const id_token = response.credential;

    // Decode token to get user info
    var payload = JSON.parse(atob(id_token.split('.')[1]));
    var userName = payload.name;
    var userEmail = payload.email;

    var user = jwt_decode(response.credential);
    userData = {
      name: user.name,
      email: user.email,
    };

    document.getElementById('userInfo').style.display = 'block';
    document.getElementById('userName').textContent = userName;

    console.log('payload',payload)

    // Show form
    document.querySelector('#honeyForm').style.display = 'block';
    document.querySelector('.g_id_signin').style.display = 'none';

    // Optional: Save to use in form submission
    window.loggedInEmail = userEmail;

    document.getElementById('userInfo').style.display = 'block';
    document.getElementById('userInfo').innerText = `Welcome, ${userName}`;
  }

// ------------login----end

  const form = document.getElementById('honeyForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    const orderData = {};
    const fullData = {};
    formData.forEach((value, key) => orderData[key] = value);

    fullData['userData'] = userData;
    fullData['orderData'] = orderData;

    finalData = JSON.stringify(fullData);
    console.log('finalData=', finalData)

    $.ajax({
         method: 'POST',
         url: 'https://script.google.com/macros/s/AKfycbzQmlo_P0NfPPbmROCOYkBv8w8u3P828YWl1edubBKt1q11smtfocdJfQXQvGGPUOD3fg/exec',
         data: finalData,
         dataType: 'json',
         contentType: false,
         processData: false,
         beforeSend: function(){
          // $('.loader-bg').fadeIn();
          }
        })
        .done(function(callback){
          console.log(callback)
        })
        .fail(function(callback) {
        })
       .always(function(){
        });
  });
</script>

</body>
</html>
