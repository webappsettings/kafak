<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Order Form</title>
  <style>
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      form {
        width: 100%;
        padding: 15px;
        border-width: 1px;
      }

      input, textarea, button {
        font-size: 1em;
        padding: 8px;
      }

      h2 {
        font-size: 1.2em;
      }
    }

    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      padding: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 2px solid #f9a825;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f9a825;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    h2 {
      text-align: center;
      color: #f57f17;
    }
    #response {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Order Pure Honey</h2>

  <form id="honeyForm" action="?" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <textarea name="address" placeholder="Delivery Address" required></textarea>
    <input type="number" name="quantity" placeholder="Quantity (in grams/ml)" required>
    <textarea name="message" placeholder="Any special instructions?"></textarea>

    <!-- <button type="submit">Place Order</button> -->
    <button class="g-recaptcha" data-sitekey="6LdJ5w0rAAAAAF7QfRkND3V0b6dKrvWKWz8onZhP" data-callback="onSubmit">Submit</button>
    <p id="response"></p>
  </form>

  <script src="jquery-3.6.1.min.js"></script>
  <script src="https://www.google.com/recaptcha/api.js?render=6LdJ5w0rAAAAAF7QfRkND3V0b6dKrvWKWz8onZhP"></script>

  <script>
    const form = document.getElementById('honeyForm');
    var LOCAL_KEY = 'honey_order_code';

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('honey_name')) {
        form.name.value = localStorage.getItem('honey_name');
      }
      if (localStorage.getItem('honey_phone')) {
        form.phone.value = localStorage.getItem('honey_phone');
      }
      if (localStorage.getItem('honey_address')) {
        form.address.value = localStorage.getItem('honey_address');
      }


      const code = localStorage.getItem(LOCAL_KEY);
            if (code) {
              // Try fetch existing order details by code using createTextFinder
              fetch(`https://script.google.com/macros/s/AKfycbxESYwK1mnZzCTwHE-YTvSosLG9MQ2iLW2ShHxVwoClhiHOCA40dSn2xc-QPjWA36MrOQ/exec?action=get&code=${code}`)
                .then(res => res.json())
                .then(data => {
                  console.log("Fetched data:", data);
                  if (data.result === 'success') {
                    const d = data.data;
                    form.name.value = d.name;
                    form.phone.value = d.phone;
                    form.address.value = d.address;
                    form.quantity.value = d.quantity;
                    form.message.value = d.message;
                  }
                })
                .catch(err => {
                  console.error("Error fetching order:", err);
                });
            }
    });

    

    function generateCode() {
      return 'HNY-' + Math.random().toString(36).substr(2, 9).toUpperCase();
    }

    function onSubmit(token1) {
      if (typeof grecaptcha === 'undefined') {
          alert('reCAPTCHA not ready yet. Please wait a moment and try again.');
          return;
        }

        
        // Load saved user details if available
    


     

        grecaptcha.ready(function () {
          grecaptcha.execute('6LdJ5w0rAAAAAF7QfRkND3V0b6dKrvWKWz8onZhP', { action: 'submit' }).then(function (token) {
            const formData = new FormData(form);
            const orderData = {};
            formData.forEach((value, key) => {
              if (key !== 'g-recaptcha-response') {
                orderData[key] = value;
              }
            });

               // Save name, phone, and address to localStorage
              localStorage.setItem('honey_name', orderData.name || '');
              localStorage.setItem('honey_phone', orderData.phone || '');
              localStorage.setItem('honey_address', orderData.address || '');

              const orderCode = localStorage.getItem(LOCAL_KEY) || generateCode();
              localStorage.setItem(LOCAL_KEY, orderCode);

              orderData.code = orderCode;

            const fullData = {
              userData: {},
              orderData: orderData,
              'g-recaptcha-response': token1
            };

            const finalData = JSON.stringify(fullData);
            console.log('finalData=', finalData);

            $.ajax({
              method: 'POST',
              url: 'https://script.google.com/macros/s/AKfycbwxBEHHLhh26NvlsPkK71KQ0SulQWIOPgdxFIBokVDxSoe9Rvekd_aXaB4DxedAWwsfiQ/exec',
              data: finalData,
              dataType: 'json',
              contentType: false,
              processData: false,
              beforeSend: function () {
                // Optional: Add loader here
              }
            })
              .done(function (callback) {
                console.log(callback);
                document.getElementById('response').textContent = 'Order submitted successfully!';
              })
              .fail(function (callback) {
                console.error(callback);
                document.getElementById('response').textContent = 'Failed to submit order. Please try again.';
              });
            
          });
        });

    }

  </script>
</body>
</html>
