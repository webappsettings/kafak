    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      padding: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 2px solid #f9a825;
      background-color: #fff;
      border-radius: 10px;

    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f9a825;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    h2 {
      text-align: center;
      color: #f57f17;
    }
    #response {
      text-align: center;
      color: green;
    }
  </style>
</head>
