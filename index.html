<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Honey Order Form</title>
  <style>

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      form {
        width: 100%;
        padding: 15px;
        border-width: 1px;
      }

      input, textarea, button {
        font-size: 1em;
        padding: 8px;
      }

      h2 {
        font-size: 1.2em;
      }
    }

    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      padding: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border: 2px solid #f9a825;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #f9a825;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #f57f17;
    }
    h2 {
      text-align: center;
      color: #f57f17;
    }
    #response {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Order Pure Honey</h2>

  <form id="honeyForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <textarea name="address" placeholder="Delivery Address" required></textarea>
    <input type="number" name="quantity" placeholder="Quantity (in grams/ml)" required>
    <textarea name="message" placeholder="Any special instructions?"></textarea>
    <div class="g-recaptcha" data-sitekey="6Lcp0w0rAAAAAHy_8FDiyiM1l_3cszrBPG0HGJ3C"></div>
    <button type="submit">Place Order</button>
    <p id="response"></p>

  </form>

  <script src="jquery-3.6.1.min.js"></script>
  <!-- Include this in <head> -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <script>
    const form = document.getElementById('honeyForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const captchaResponse = grecaptcha.getResponse();
        if (!captchaResponse) {
          alert('Please verify you are human.');
          return;
        }
        formData.append('g-recaptcha-response', captchaResponse);


      const formData = new FormData(form);
      const orderData = {};
      formData.forEach((value, key) => orderData[key] = value);

      const fullData = {
        userData: {},
        orderData: orderData
      };

      const finalData = JSON.stringify(fullData);
      console.log('finalData=', finalData);

      $.ajax({
        method: 'POST',
        url: 'https://script.google.com/macros/s/AKfycbzQmlo_P0NfPPbmROCOYkBv8w8u3P828YWl1edubBKt1q11smtfocdJfQXQvGGPUOD3fg/exec',
        data: finalData,
        dataType: 'json',
        contentType: false,
        processData: false,
        beforeSend: function() {
          // Loading indicator can go here
        }
      })
      .done(function(callback) {
        console.log(callback);
        document.getElementById('response').textContent = 'Order submitted successfully!';
      })
      .fail(function(callback) {
        console.error(callback);
        document.getElementById('response').textContent = 'Failed to submit order. Please try again.';
      });
    });
  </script>
</body>
</html>
