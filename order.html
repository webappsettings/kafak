<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAFAK Honey | Order Now</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --theme-green: #2e7d32;
      --theme-light-green: #43a047;
      --honey-gold: #f5a623;
      --soft-bg: #f1f8e9;
    }

    body {
      background: var(--soft-bg);
      font-family: 'Poppins', 'Noto Sans Malayalam', sans-serif;
      padding-top: 80px;
      padding-bottom: 100px;
      /* Space for Admin Bar */
      min-height: 100vh;
    }

    /* Navbar */
    .navbar-custom {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    /* Card & Inputs */
    .main-card {
      background: #fff;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(46, 125, 50, 0.1);
      border: none;
      padding: 30px;
    }

    .form-control-custom {
      border-radius: 15px;
      padding: 12px 15px;
      border: 2px solid #eee;
      font-weight: 500;
    }

    .big-input {
      height: 60px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* Steps & Progress */
    .progress-track {
      display: flex;
      margin-bottom: 30px;
      position: relative;
    }

    .progress-line {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      z-index: 1;
    }

    .progress-bar-custom {
      position: absolute;
      top: 15px;
      left: 0;
      height: 4px;
      background: var(--honey-gold);
      z-index: 2;
      width: 0%;
      transition: width 0.4s;
    }

    .step-dot {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #e0e0e0;
      z-index: 3;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ccc;
    }

    .step-dot.active {
      border-color: var(--honey-gold);
      color: var(--honey-gold);
    }

    .step-dot.completed {
      background: var(--theme-green);
      border-color: var(--theme-green);
      color: white;
    }

    /* Loader */
    #main-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .spinner-green {
      width: 50px;
      height: 50px;
      border: 5px solid #eee;
      border-top: 5px solid var(--theme-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .btn-next,
    .btn-submit {
      background: linear-gradient(45deg, var(--theme-green), var(--theme-light-green));
      border: none;
      color: white;
      font-weight: 700;
      padding: 15px;
      border-radius: 50px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand py-0" href="index.html">
        <img src="logo-order.png" alt="Kafak Logo" height="45">
      </a>
      <div class="d-flex align-items-center">
        <select class="lang-select me-2" onchange="changeLanguage(this.value)"
          style="border-radius:20px; padding:5px; border:2px solid var(--theme-green);">
          <option value="ml" selected>Malayalam</option>
          <option value="en">English</option>
        </select>
        <a href="index.html" class="btn btn-outline-success btn-sm rounded-pill px-3 fw-bold">🏠 Home</a>
      </div>
    </div>
  </nav>

  <div id="main-loader">
    <div class="spinner-green"></div>
    <p class="mt-3 fw-bold text-muted">Loading...</p>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card main-card">

          <div class="progress-track">
            <div class="progress-line"></div>
            <div id="progressBar" class="progress-bar-custom"></div>
            <div class="flex-fill d-flex justify-content-center position-relative">
              <div id="dot-1" class="step-dot active">1</div>
            </div>
            <div class="flex-fill d-flex justify-content-center position-relative">
              <div id="dot-2" class="step-dot">2</div>
            </div>
          </div>

          <div id="showsuccess" class="text-center py-4" style="display:none;">
            <div style="font-size: 60px;">🎉</div>
            <h3 class="fw-bold text-success mt-3">ഓർഡർ ലഭിച്ചു!</h3>
            <p class="text-muted">വാട്സാപ്പിലേക്ക് പോകുന്നു...</p>
            <button onclick="sendToWhatsapp()" class="btn btn-success w-100 py-3 rounded-pill fw-bold shadow-sm">
              <i class="fab fa-whatsapp me-2"></i> WhatsApp-ലേക്ക് അയക്കുക
            </button>
          </div>

          <form id="order-form">
            <div id="step-1" class="step-container active">
              <div class="text-center mb-4">
                <h4 class="fw-bold text-success" data-i18n="step1_title">നിങ്ങളുടെ ഫോൺ നമ്പർ?</h4>
                <p class="text-muted small" data-i18n="step1_desc">ഓർഡർ ചെയ്യാൻ മൊബൈൽ നമ്പർ നൽകുക</p>
              </div>
              <input type="tel" class="form-control form-control-custom big-input mb-3" id="phone" name="phone"
                placeholder="Mobile Number" maxlength="10" required>

              <div id="name-section" style="display:none;">
                <label class="form-label text-success small fw-bold">പേര് എന്താണ്?</label>
                <input type="text" class="form-control form-control-custom" id="temp_name" placeholder="നിങ്ങളുടെ പേര്">
              </div>

              <button type="button" id="btnNext" onclick="handleStep1()" class="btn-next mt-3">അടുത്തത് ➔</button>
            </div>

            <div id="step-2" class="step-container" style="display:none;">

              <div id="saved-address-card" class="card p-3 mb-3 border-success shadow-sm"
                style="display:none; background: #f9fff9; border-radius: 15px;">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <small class="text-success fw-bold"><i class="fas fa-user-check me-1"></i> Delivery Details</small>
                  <button type="button" class="btn btn-sm btn-outline-dark rounded-pill px-2 py-0"
                    onclick="enableEditMode()" style="font-size:11px;">Edit ✏️</button>
                </div>
                <h6 class="fw-bold mb-0" id="summary-name">User</h6>
                <p class="small text-muted mb-0" id="summary-address"></p>
                <div class="small mt-1"><i class="fas fa-phone-alt me-1"></i> <span id="summary-phone"></span></div>
              </div>

              <div id="address-inputs">
                <input type="text" class="form-control form-control-custom mb-2" id="name" name="name"
                  placeholder="Name" required>
                <input type="tel" class="form-control form-control-custom mb-2" id="whatsapp" name="whatsapp"
                  placeholder="WhatsApp Number" maxlength="10" required>

                <div class="row g-2 mb-2">
                  <div class="col-6"><input type="text" class="form-control form-control-custom" id="house" name="house"
                      placeholder="വീട്ടുപേര്" required></div>
                  <div class="col-6"><input type="text" class="form-control form-control-custom" id="place" name="place"
                      placeholder="സ്ഥലം" required></div>
                </div>

                <input type="tel" class="form-control form-control-custom mb-2" id="pincode" name="pincode"
                  placeholder="പിൻകോഡ്" maxlength="6" required>

                <div class="row g-2 mb-3 pincodeEnable" style="display:none;">
                  <div class="col-6">
                    <select class="form-control form-control-custom" id="officename" style="display:none;"></select>
                    <input type="text" class="form-control form-control-custom" id="postoffice" placeholder="PO"
                      readonly>
                  </div>
                  <div class="col-6"><input type="text" class="form-control form-control-custom" id="district"
                      placeholder="District" readonly></div>
                </div>
                <input type="hidden" id="state" name="state">
              </div>

              <div class="p-3 rounded-4 mb-3" style="background: #fffdf0; border: 1px solid #ffe082;">
                <label class="form-label fw-bold text-success small">എത്ര ബോട്ടിൽ വേണം? 👇</label>
                <select class="form-control form-control-custom mb-2" id="quantity" name="quantity" required disabled>
                  <option value="" selected disabled>തിരഞ്ഞെടുക്കൂ...</option>
                  <option value="1">1 Bottle (650g)</option>
                  <option value="2">2 Bottles (1.3 Kg)</option>
                  <option value="3">3 Bottles (1.95 Kg)</option>
                </select>
                <div class="price-show text-end" style="display:none;">
                  <div id="totalAmt" class="fw-bold text-success fs-5"></div>
                  <small id="amt" class="text-muted"></small>
                </div>
              </div>

              <textarea class="form-control form-control-custom mb-4" id="message" rows="2"
                placeholder="മെസ്സേജ് (Optional)"></textarea>

              <div class="d-flex gap-2">
                <button type="button" onclick="backToStep1()"
                  class="btn btn-light flex-fill rounded-pill border fw-bold">⬅️ Back</button>
                <button type="submit" id="submitBtn" class="btn-submit flex-fill">ഓർഡർ ചെയ്യാം ✅</button>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  <script>
    // 🔴 FIXED: Define urlParams at start
    const urlParams = new URLSearchParams(window.location.search);
  </script>
  <script src="custom.js"></script>

</body>

</html>
