<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Honey Order - KAFAK LLP</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    /* GREEN THEME CSS */
    body {
      background-color: #f8fcf8;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 600px;
      margin-top: 20px;
      margin-bottom: 50px;
    }

    /* Card Styling */
    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      background-color: #fff;
      border-bottom: 1px solid #f0f0f0;
      border-radius: 20px 20px 0 0 !important;
      padding: 25px 20px;
      text-align: center;
    }

    /* Logo & Header */
    .main-logo {
      max-width: 180px;
      margin-bottom: 2px;
    }

    .badge-img {
      width: 100px;
      margin-top: 2px;
    }

    /* Form Fields */
    .form-control {
      border-radius: 10px;
      height: 50px;
      border: 1px solid #e0e0e0;
      background: #fafafa;
    }

    .form-control:focus {
      background: #fff;
      border-color: #43a047;
      box-shadow: none;
    }

    /* Green Focus */

    /* Buttons (Natural Green Gradient) */
    .btn-primary {
      background: linear-gradient(45deg, #43a047, #2e7d32);
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-weight: bold;
      font-size: 16px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(45deg, #2e7d32, #1b5e20);
    }

    /* Links */
    .btn-link {
      color: #2e7d32 !important;
      text-decoration: none;
      font-weight: 600;
    }

    /* Validation Error */
    .error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 5px;
      font-weight: 500;
      display: block;
    }

    /* Loader */
    #main-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loader-img {
      width: 60px;
    }

    /* Saved Address Card */
    #saved-address-card {
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    #saved-address-card h6 {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="main-loader">
    <img src="loading.gif" alt="Loading..." class="loader-img">
    <p style="margin-top:15px; color:#888; font-size:14px;">Please wait...</p>
  </div>

  <div class="container">

    <div id="showsuccess" style="display:none; text-align:center; padding: 50px 20px;">
      <img src="success.png" alt="Success" style="width: 80px; margin-bottom: 20px;">
      <h3 style="color:#2ecc71; font-weight:bold;">ഓർഡർ ലഭിച്ചു!</h3>
      <p class="text-muted">Order placed successfully.</p>
      <p style="font-size:14px;">Redirecting to WhatsApp...</p>
      <img src="whatsapp--v1.png" style="width: 40px; opacity:0.8;">
    </div>

    <div class="card" id="honeyForm">
      <div class="card-header">
        <img src="logo-order.png" alt="Kafak Life" class="main-logo"><br>
        <img src="raw-honey.png" alt="100% Raw Honey" class="badge-img">
      </div>

      <div class="card-body p-4">
        <form id="order-form" novalidate>

          <div id="saved-address-card" style="display:none;">
            <h6 style="margin-bottom:5px;">📍 Delivering to: <span id="summary-name"></span></h6>
            <p style="margin:0; font-size:14px; color:#555; line-height:1.6;">
              <span id="summary-house"></span>, <span id="summary-place"></span><br>
              <span id="summary-post"></span> - <b><span id="summary-pin"></span></b>
            </p>
            <button type="button" class="btn btn-link btn-sm p-0 mt-2" onclick="enableEditMode()">✏️ Change
              Address</button>
          </div>

          <div id="personal-section">
            <h6 class="text-muted mb-3"
              style="font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:bold;">Personal Details
            </h6>

            <div class="row">
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="phone" id="phone" placeholder="Phone Number" maxlength="10"
                  required>
              </div>
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="whatsapp" id="whatsapp" placeholder="WhatsApp No."
                  maxlength="10" required>
              </div>
            </div>

            <div class="form-group">
              <input type="text" class="form-control" name="name" id="name" placeholder="Full Name (പേര്)" required>
            </div>

            <h6 class="text-muted mb-3 mt-2"
              style="font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:bold;">Delivery Address
            </h6>

            <div class="form-group">
              <input type="text" class="form-control" name="house" id="house" placeholder="House Name / No (വീട്ടുപേര്)"
                required>
            </div>

            <div class="form-group">
              <input type="text" class="form-control" name="place" id="place" placeholder="Place / Street (സ്ഥലം)"
                required>
            </div>

            <div class="row">
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="pincode" id="pincode" placeholder="Pincode" maxlength="6"
                  required>
              </div>

              <div class="col-6 form-group">
                <select class="form-control" name="officename" id="officename" style="display:none;">
                  <option value="">Select PO</option>
                </select>
                <input type="text" class="form-control" name="postoffice" id="postoffice" placeholder="Post Office"
                  style="display:none;" readonly>
              </div>
            </div>

            <div class="row pincodeEnable" style="display:none;">
              <div class="col-6 form-group">
                <input type="text" class="form-control" name="district" id="district" readonly>
              </div>
              <div class="col-6 form-group">
                <input type="text" class="form-control" name="state" id="state" readonly>
              </div>
            </div>
          </div>

          <div id="order-section" class="mt-4 pt-3" style="border-top: 2px dashed #f0f0f0;">
            <div class="form-group">
              <label style="font-weight:600; color:#333; font-size:15px;">
                Select Quantity <img src="downhand.png" style="width:20px; vertical-align:middle;">
              </label>
              <select class="form-control" name="quantity" id="quantity" required disabled
                style="border: 2px solid #e0e0e0;">
                <option value="">എത്ര ബോട്ടിൽ വേണം?</option>
                <option value="1">1 Bottle (650 g)</option>
                <option value="2">2 Bottles</option>
                <option value="3">3 Bottles</option>
                <option value="4">4 Bottles</option>
                <option value="5">5 Bottles</option>
                <option value="6">6 Bottles</option>
                <option value="8">8 Bottles</option>
                <option value="10">10 Bottles</option>
              </select>
            </div>

            <div class="price-show mb-3"
              style="display:none; background: #f1f8e9; padding: 15px; border-radius: 12px; text-align: center; border: 1px dashed #a5d6a7;">
              <p style="margin:0; font-size:14px; color:#558b2f;" id="amt"></p>
              <h4 style="margin:5px 0 0; font-weight:bold; color:#2e7d32;" id="totalAmt"></h4>
            </div>

            <div class="form-group">
              <textarea class="form-control" name="message" id="message" rows="2"
                placeholder="പ്രത്യേകം എന്തെങ്കിലും പറയാനുണ്ടെങ്കിൽ ഇവിടെ എഴുതാം.."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">CONFIRM ORDER</button>
          </div>

        </form>
      </div>
      <div class="card-footer text-center text-muted small"
        style="background:#fff; border-top:none; padding-bottom:20px;">
        KAFAK LLP &copy; 2026
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  <script src="custom.js"></script>

</body>

</html>
