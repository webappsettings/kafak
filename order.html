<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KAFAK | Premium Honey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Malayalam:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --primary: #000;
      --secondary: #fff;
      --text-gray: #666;
    }

    body {
      background: var(--secondary);
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
      padding-top: 80px;
      padding-bottom: 100px;
    }

    /* Logo & Nav */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .brand-logo {
      font-weight: 900;
      font-size: 26px;
      letter-spacing: -1px;
      text-decoration: none;
      color: black;
    }

    /* Inputs */
    .huge-input {
      border: none;
      border-bottom: 2px solid #eee;
      padding: 15px 0;
      font-size: 26px;
      font-weight: 700;
      width: 100%;
      outline: none;
      border-radius: 0;
      background: transparent;
    }

    .huge-input:focus {
      border-color: black;
    }

    .form-label {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .regular-input {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      font-weight: 600;
      outline: none;
    }

    .regular-input:focus {
      border-color: black;
    }

    /* Buttons */
    .btn-black {
      background: black;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-black:active {
      transform: scale(0.98);
    }

    /* Summary Card (Returning User) */
    .summary-card {
      background: #f9f9f9;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eee;
      margin-bottom: 20px;
    }

    .address-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .edit-link {
      font-size: 12px;
      font-weight: 700;
      color: black;
      text-decoration: underline;
      cursor: pointer;
      float: right;
    }

    /* Final Review Card (New User) */
    .review-card {
      background: #fff;
      border: 2px solid #000;
      border-radius: 16px;
      padding: 20px;
    }

    .review-item {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .review-label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }

    .review-val {
      font-weight: 700;
      text-align: right;
    }

    /* Loader */
    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #eee;
      border-top-color: black;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Sections */
    .step-section {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div id="full-loader">
    <div class="spinner"></div>
    <p class="mt-3 fw-bold small text-muted" id="loader-text">Loading...</p>
  </div>

  <nav class="navbar fixed-top">
    <div class="container">
      <a href="#" class="brand-logo">KAFAK.</a>
      <select class="form-select form-select-sm border-0 bg-light fw-bold" style="width:auto;"
        onchange="changeLanguage(this.value)">
        <option value="ml">MALAYALAM</option>
        <option value="en">ENGLISH</option>
      </select>
    </div>
  </nav>

  <div class="container" style="max-width: 500px;">

    <div id="showsuccess" class="text-center" style="display:none; padding-top: 50px;">
      <div style="font-size: 60px;">🎉</div>
      <h2 class="fw-bold mt-3 mb-2" data-i18n="order_success">Order Placed!</h2>
      <p class="text-muted mb-4" data-i18n="redirect_wa">Redirecting to WhatsApp...</p>
      <button onclick="sendToWhatsapp()" class="btn-black">
        <i class="fab fa-whatsapp"></i> <span data-i18n="open_wa">Open WhatsApp</span>
      </button>
    </div>

    <form id="order-form">

      <div id="step-0" class="step-section" style="display:block;">
        <label class="form-label" data-i18n="lbl_phone">Phone Number</label>
        <input type="tel" id="phone" class="huge-input" placeholder="9876543210" maxlength="10">
        <div class="fixed-bottom p-3 bg-white border-top">
          <div class="container p-0" style="max-width: 500px;">
            <button type="button" class="btn-black" onclick="handlePhoneNext()">
              <span data-i18n="btn_next">CONTINUE</span>
            </button>
          </div>
        </div>
      </div>

      <div id="returning-user-view" class="step-section">
        <h3 class="fw-bold mb-3" data-i18n="welcome_back">Welcome Back!</h3>

        <div class="summary-card">
          <span class="edit-link" onclick="toggleAddressEdit()" data-i18n="btn_edit">EDIT ADDRESS</span>
          <div class="fw-bold" id="saved-name">User Name</div>
          <div class="text-muted small mt-1" id="saved-address-text">Address Line 1...</div>

          <div class="address-box" id="address-edit-box">
            <label class="form-label" data-i18n="lbl_house">House Name / No</label>
            <input type="text" id="edit-house" class="regular-input mb-2">
            <label class="form-label" data-i18n="lbl_place">Place</label>
            <input type="text" id="edit-place" class="regular-input mb-2">
            <label class="form-label" data-i18n="lbl_pincode">Pincode</label>
            <input type="tel" id="edit-pincode" class="regular-input mb-2" maxlength="6">
            <input type="hidden" id="edit-postoffice">
            <input type="hidden" id="edit-district">
            <input type="hidden" id="edit-state">
          </div>
        </div>

        <label class="form-label" data-i18n="lbl_qty">Select Quantity</label>
        <select id="quick-qty" class="regular-input mb-3">
          <option value="" disabled selected>Select...</option>
        </select>

        <label class="form-label" data-i18n="lbl_msg">Message (Optional)</label>
        <textarea id="quick-msg" class="regular-input mb-3" rows="1"></textarea>

        <div class="text-end mb-4">
          <div class="fw-bold fs-4" id="quick-price">₹0</div>
          <small class="text-muted" data-i18n="courier_included">(Courier Charge Included)</small>
        </div>

        <div class="fixed-bottom p-3 bg-white border-top">
          <div class="container p-0" style="max-width: 500px;">
            <button type="button" class="btn-black" onclick="submitQuickOrder()" id="btn-quick-submit">
              <span data-i18n="btn_update">UPDATE ORDER</span>
            </button>
          </div>
        </div>
      </div>

      <div id="wizard-view" class="step-section">

        <div class="progress mb-4" style="height: 4px;">
          <div class="progress-bar bg-dark" id="wiz-progress" style="width: 10%;"></div>
        </div>

        <div class="wiz-step" data-step="1">
          <label class="form-label" data-i18n="lbl_name">Full Name</label>
          <input type="text" id="name" class="huge-input" autofocus>
        </div>

        <div class="wiz-step" data-step="2" style="display:none;">
          <label class="form-label" data-i18n="lbl_whatsapp">WhatsApp Number</label>
          <input type="tel" id="whatsapp" class="huge-input">
        </div>

        <div class="wiz-step" data-step="3" style="display:none;">
          <label class="form-label" data-i18n="lbl_pincode">Pincode</label>
          <input type="tel" id="pincode" class="huge-input" maxlength="6">
          <p id="pin-error" class="text-danger small mt-2" style="display:none;">Invalid Pincode</p>
        </div>

        <div class="wiz-step" data-step="3.5" style="display:none;">
          <label class="form-label" data-i18n="lbl_select_po">Select Post Office</label>
          <select id="po-select" class="huge-input border-0 bg-transparent">
            <option value="">Select...</option>
          </select>
        </div>

        <div class="wiz-step" data-step="4" style="display:none;">
          <label class="form-label" data-i18n="lbl_house">House Name / Number</label>
          <input type="text" id="house" class="huge-input">
          <div class="mt-3 text-muted small">
            <span id="display-place"></span>, <span id="display-dist"></span>
          </div>
        </div>

        <div class="wiz-step" data-step="5" style="display:none;">
          <label class="form-label" data-i18n="lbl_altphone">Alternate Phone (Optional)</label>
          <input type="tel" id="altphone" class="huge-input" placeholder="Optional">
        </div>

        <div class="wiz-step" data-step="6" style="display:none;">
          <label class="form-label" data-i18n="lbl_qty">Select Quantity</label>
          <select id="quantity" class="huge-input border-0 bg-transparent">
            <option value="" disabled selected>Select...</option>
          </select>
          <label class="form-label mt-4" data-i18n="lbl_msg">Message (Optional)</label>
          <input type="text" id="message" class="regular-input" placeholder="...">

          <div class="mt-4 text-end">
            <div class="fw-bold fs-3" id="wiz-price">₹0</div>
            <small class="text-muted" data-i18n="courier_included">(Courier Charge Included)</small>
          </div>
        </div>

        <div class="wiz-step" data-step="7" style="display:none;">
          <h3 class="fw-bold mb-3" data-i18n="lbl_summary">Order Summary</h3>
          <div class="review-card">
            <div class="review-item"><span class="review-label" data-i18n="lbl_name">Name</span><span class="review-val"
                id="rev-name"></span></div>
            <div class="review-item"><span class="review-label" data-i18n="lbl_phone">Phone</span><span
                class="review-val" id="rev-phone"></span></div>
            <div class="review-item"><span class="review-label" data-i18n="lbl_address">Address</span><span
                class="review-val text-end" id="rev-address"></span></div>
            <hr>
            <div class="review-item"><span class="review-label" data-i18n="lbl_qty">Item</span><span class="review-val"
                id="rev-qty"></span></div>
            <div class="review-item"><span class="review-label">Total</span><span class="review-val fs-5"
                id="rev-total"></span></div>
          </div>
        </div>

        <div class="fixed-bottom p-3 bg-white border-top">
          <div class="container p-0 d-flex gap-2" style="max-width: 500px;">
            <button type="button" class="btn btn-light border fw-bold" style="width: 50px;"
              onclick="prevStep()">←</button>
            <button type="button" class="btn-black" onclick="nextStep()" id="btn-wiz-next">
              <span data-i18n="btn_next">NEXT</span>
            </button>
          </div>
        </div>

      </div>

    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="custom.js"></script>
</body>

</html>
