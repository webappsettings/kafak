<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>KAFAK | Premium Honey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+Malayalam:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #000;
      --secondary: #fff;
      --text-gray: #666;
      --brand-green: #2e7d32;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--secondary);
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
    }

    #app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    .navbar {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.98);
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      z-index: 10;
    }

    .brand-logo-img {
      height: 40px;
      width: auto;
      cursor: pointer;
    }

    .scroll-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 40px;
      -webkit-overflow-scrolling: touch;
    }

    .footer-action {
      flex: 0 0 auto;
      background: white;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      z-index: 20;
    }

    .huge-input {
      border: none;
      border-bottom: 2px solid #eee;
      padding: 15px 0;
      font-size: 24px;
      font-weight: 700;
      width: 100%;
      outline: none;
      border-radius: 0;
      background: transparent;
      transition: border-color 0.3s;
    }

    .huge-input:focus {
      border-color: var(--brand-green);
    }

    .form-label {
      font-weight: 700;
      font-size: 13px;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .regular-input,
    select.regular-input,
    select.huge-input {
      border: 2px solid #eee !important;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      font-weight: 600;
      outline: none;
      background: white;
      transition: border-color 0.3s;
    }

    .regular-input:focus,
    select:focus {
      border-color: var(--brand-green) !important;
    }

    .btn-black {
      background: black;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: background 0.3s ease;
    }

    .btn-black:active {
      transform: scale(0.98);
    }

    .btn-brand-green {
      background: var(--brand-green) !important;
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
    }

    .btn-back {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      background: #f5f5f5;
      border: none;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .btn-back:active {
      background: #e0e0e0;
    }

    .btn-back i {
      font-size: 20px;
    }

    .summary-card {
      background: #fdfdfd;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #eee;
      border-left: 4px solid var(--brand-green);
      margin-bottom: 20px;
    }

    .address-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .edit-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-green);
      cursor: pointer;
      float: right;
    }

    .review-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
    }

    .review-item {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
    }

    .review-val {
      font-weight: 700;
      text-align: right;
      font-size: 15px;
    }

    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f0f0f0;
      border-top-color: var(--brand-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .progress-bar-custom {
      height: 4px;
      background: #f0f0f0;
      width: 100%;
      margin-bottom: 25px;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand-green);
      width: 0%;
      transition: width 0.3s ease;
    }

    .step-section {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ios-popup {
      border-radius: 25px !important;
      padding: 20px !important;
      font-family: 'Manrope', sans-serif !important;
    }

    .ios-title {
      font-size: 22px !important;
      font-weight: 800 !important;
      color: #000 !important;
    }

    .ios-content {
      font-size: 16px !important;
      color: #555 !important;
      font-weight: 500 !important;
    }

    .ios-btn {
      border-radius: 12px !important;
      padding: 12px 25px !important;
      font-weight: 700 !important;
      background: black !important;
    }

    .ios-btn-cancel {
      border-radius: 12px !important;
      padding: 12px 25px !important;
      font-weight: 700 !important;
      background: #f2f2f2 !important;
      color: #000 !important;
    }

    .loc-box {
      margin-top: 15px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 10px;
      border: 1px dashed #ccc;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .loc-icon {
      color: #d32f2f;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div id="full-loader">
    <div class="spinner"></div>
    <p class="mt-3 fw-bold small text-muted" id="loader-text">വിവരങ്ങൾ എടുക്കുന്നു...</p>
  </div>

  <div id="app-layout">
    <nav class="navbar">
      <div class="container d-flex justify-content-between align-items-center">
        <a href="#" class="navbar-brand d-flex align-items-center" onclick="confirmHome()">
          <img src="logo.png" alt="KAFAK" class="brand-logo-img"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <span style="display:none; font-weight:900; font-size:24px; color:black;">KAFAK.</span>
        </a>
        <select class="form-select form-select-sm border-0 bg-light fw-bold text-secondary" style="width:auto;"
          onchange="changeLanguage(this.value)">
          <option value="ml" selected>മലയാളം</option>
          <option value="en">ENGLISH</option>
        </select>
      </div>
    </nav>

    <div class="scroll-content">
      <div class="container" style="max-width: 500px;">

        <div id="showsuccess" class="text-center step-section" style="padding-top: 50px;">
          <div style="font-size: 60px; color: var(--brand-green);">Verified</div>
          <h2 class="fw-bold mt-3 mb-2" data-i18n="order_success">ഓർഡർ ലഭിച്ചു!</h2>
          <p class="text-muted mb-4" data-i18n="redirect_wa">വാട്സാപ്പിലേക്ക് പോകുന്നു...</p>
          <button onclick="sendToWhatsapp()" class="btn-black">
            <i class="fab fa-whatsapp"></i> <span data-i18n="open_wa">വാട്സാപ്പ് ഓപ്പൺ ചെയ്യാം</span>
          </button>
        </div>

        <form id="order-form" onsubmit="return false;">

          <div id="step-0" class="step-section">
            <label class="form-label" data-i18n="lbl_phone">ഫോൺ നമ്പർ</label>
            <input type="tel" id="phone" class="huge-input" placeholder="മൊബൈൽ നമ്പർ" maxlength="10">
          </div>

          <div id="returning-user-view" class="step-section">
            <h4 class="fw-bold mb-3" data-i18n="welcome_back">സ്വാഗതം!</h4>
            <div class="summary-card">
              <span class="edit-link" onclick="toggleAddressEdit()" data-i18n="btn_edit">മാറ്റാം ✏️</span>

              <div class="fw-bold fs-5" id="saved-name">User Name</div>
              <div class="text-muted small mt-1">
                <span id="saved-address-text">Address...</span><br>
                <span id="saved-place-dist"></span><br>
                <span id="saved-phone-text" class="fw-bold text-dark"></span> |
                <span id="saved-wa-text" class="text-success"><i class="fab fa-whatsapp"></i> <span></span></span>
                <span id="saved-alt-text" style="display:none;"> | Alt: <span></span></span>
              </div>

              <div class="address-box" id="address-edit-box">
                <hr>
                <label class="form-label" data-i18n="lbl_phone">ഫോൺ നമ്പർ</label>
                <input type="tel" id="edit-phone" class="regular-input mb-2" maxlength="10"
                  oninput="updateSummaryDisplay()">

                <label class="form-label" data-i18n="lbl_house">വീട്ടുപേര് / നമ്പർ</label>
                <input type="text" id="edit-house" class="regular-input mb-2" oninput="updateSummaryDisplay()">

                <label class="form-label" data-i18n="lbl_place">സ്ഥലം</label>
                <input type="text" id="edit-place" class="regular-input mb-2" oninput="updateSummaryDisplay()">

                <label class="form-label" data-i18n="lbl_pincode">പിൻകോഡ്</label>
                <input type="tel" id="edit-pincode" class="regular-input mb-2" maxlength="6"
                  oninput="handleEditPincode(this.value)">
                <div id="edit-single-po" class="loc-box" style="display:none; margin-top: 5px; padding: 10px;"></div>

                <div id="edit-po-wrapper" style="display:none;">
                  <label class="form-label">പോസ്റ്റ് ഓഫീസ് (Select)</label>
                  <select id="edit-postoffice-select" class="regular-input mb-2"
                    onchange="selectEditPO(this.value)"></select>
                </div>

                <label class="form-label">WhatsApp Number</label>
                <input type="tel" id="edit-whatsapp" class="regular-input mb-2" maxlength="10"
                  oninput="updateSummaryDisplay()">

                <label class="form-label">Alt Phone (Optional)</label>
                <input type="tel" id="edit-altphone" class="regular-input mb-2" maxlength="10"
                  oninput="updateSummaryDisplay()">

                <input type="hidden" id="edit-postoffice">
                <input type="hidden" id="edit-district">
                <input type="hidden" id="edit-state">
              </div>
            </div>

            <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
            <select id="quick-qty" class="regular-input mb-3">
              <option value="" disabled selected>Select...</option>
            </select>

            <label class="form-label" data-i18n="lbl_msg">മെസ്സേജ് (ആവശ്യമെങ്കിൽ)</label>
            <textarea id="quick-msg" class="regular-input mb-3" rows="1"></textarea>

            <div class="text-end mb-4">
              <div class="fw-bold fs-4 text-dark" id="quick-price">₹0</div>
              <small class="text-muted" style="font-size:11px;" data-i18n="courier_included">(കൊറിയര്‍ ചാർജ്
                ഉൾപ്പെടെ)</small>
            </div>
          </div>

          <div id="wizard-view" class="step-section">
            <div class="progress-bar-custom">
              <div class="progress-fill" id="wiz-progress" style="width: 10%;"></div>
            </div>

            <div class="wiz-step" data-step="1">
              <label class="form-label" data-i18n="lbl_name">നിങ്ങളുടെ പേര്</label>
              <input type="text" id="name" class="huge-input" placeholder="പേര്" autofocus>
            </div>
            <div class="wiz-step" data-step="2" style="display:none;">
              <label class="form-label" data-i18n="lbl_whatsapp">വാട്സാപ്പ് നമ്പർ</label>
              <input type="tel" id="whatsapp" class="huge-input" placeholder="WhatsApp" maxlength="10">
            </div>
            <div class="wiz-step" data-step="3" style="display:none;">
              <label class="form-label" data-i18n="lbl_pincode">പിൻകോഡ്</label>
              <input type="tel" id="pincode" class="huge-input" maxlength="6" placeholder="000000">
            </div>
            <div class="wiz-step" data-step="3.5" style="display:none;">
              <label class="form-label" data-i18n="lbl_select_po">പോസ്റ്റ് ഓഫീസ് തിരഞ്ഞെടുക്കുക</label>
              <select id="po-select" class="huge-input border-0 bg-transparent">
                <option value="">Select...</option>
              </select>
            </div>

            <div class="wiz-step" data-step="4" style="display:none;">
              <label class="form-label" data-i18n="lbl_house">വീട്ടുപേര് / നമ്പർ</label>
              <input type="text" id="house" class="huge-input" placeholder="House Name">
            </div>

            <div class="wiz-step" data-step="5" style="display:none;">
              <label class="form-label" data-i18n="lbl_place">സ്ഥലം</label>
              <input type="text" id="place" class="huge-input" placeholder="Place" list="place-list"
                oninput="updateWizardLocDisplay()">
              <datalist id="place-list"></datalist>

              <div class="loc-box">
                <i class="fas fa-map-marker-alt loc-icon"></i>
                <div>
                  <div style="font-weight:700; color:#000;" id="display-po"></div>
                  <div id="display-dist-state"></div>
                </div>
              </div>
            </div>

            <div class="wiz-step" data-step="6" style="display:none;">
              <label class="form-label" data-i18n="lbl_altphone">വിളിച്ചാൽ കിട്ടുന്ന മറ്റൊരു നമ്പർ (Optional)</label>
              <input type="tel" id="altphone" class="huge-input" placeholder="Alternate Phone" maxlength="10">
            </div>
            <div class="wiz-step" data-step="7" style="display:none;">
              <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
              <select id="quantity" class="huge-input border-0 bg-transparent">
                <option value="" disabled selected>Select...</option>
              </select>
              <label class="form-label mt-4" data-i18n="lbl_msg">മെസ്സേജ് (ആവശ്യമെങ്കിൽ)</label>
              <input type="text" id="message" class="regular-input" placeholder="...">
              <div class="mt-4 text-end">
                <div class="fw-bold fs-3" id="wiz-price">₹0</div>
                <small class="text-muted" data-i18n="courier_included">(കൊറിയര്‍ ചാർജ് ഉൾപ്പെടെ)</small>
              </div>
            </div>
            <div class="wiz-step" data-step="8" style="display:none;">
              <h4 class="fw-bold mb-3" data-i18n="lbl_summary">ഓർഡർ വിവരങ്ങൾ</h4>
              <div class="review-card">
                <div class="review-item"><span class="review-label" data-i18n="lbl_name">പേര്</span><span
                    class="review-val" id="rev-name"></span></div>
                <div class="review-item"><span class="review-label" data-i18n="lbl_phone">ഫോൺ</span><span
                    class="review-val" id="rev-phone"></span></div>
                <div class="review-item"><span class="review-label" data-i18n="lbl_address">വിലാസം</span><span
                    class="review-val text-end" id="rev-address"></span></div>
                <hr style="border-color:#eee;">
                <div class="review-item"><span class="review-label" data-i18n="lbl_qty">സാധനം</span><span
                    class="review-val" id="rev-qty"></span></div>
                <div class="review-item"><span class="review-label">Total</span><span
                    class="review-val fs-5 text-success" id="rev-total"></span></div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="footer-action">
      <div class="container p-0" style="max-width: 500px;">
        <div id="btn-group-0" style="display:none;">
          <button type="button" class="btn-black" onclick="handlePhoneNext()">
            <span data-i18n="btn_next">തുടരുക</span>
          </button>
        </div>

        <div id="btn-group-wizard" style="display:none;">
          <button type="button" class="btn-back" onclick="prevStep()">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button type="button" class="btn-black flex-grow-1 ms-3" onclick="nextStep()" id="btn-wiz-next">
            <span data-i18n="btn_next">തുടരുക</span>
          </button>
        </div>

        <div id="btn-group-returning" style="display:none;">
          <button type="button" class="btn-black btn-brand-green" onclick="submitQuickOrder()" id="btn-quick-submit">
            <span data-i18n="btn_update">ഓർഡർ ചെയ്യാം</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="text-center mt-3 pb-5">
    <button onclick="clearMyData()" class="btn btn-sm btn-light text-muted"
      style="font-size: 10px; border-radius:20px;">
      🛠️ Reset App
    </button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="custom.js"></script>
  <script>
    function clearMyData() {
      Swal.fire({
        title: 'Reset App?',
        text: "വിവരങ്ങൾ ക്ലിയർ ചെയ്യും.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#000',
        cancelButtonColor: '#f2f2f2',
        confirmButtonText: 'Yes',
        customClass: { popup: 'ios-popup', title: 'ios-title', confirmButton: 'ios-btn', cancelButton: 'ios-btn-cancel' }
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.removeItem('kafakUsers');
          location.reload();
        }
      })
    }
  </script>
</body>

</html>
