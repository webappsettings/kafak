<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>KAFAK | Natural Raw Honey</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* --- CORE VARIABLES & RESET --- */
    :root {
      --primary: #000;
      --secondary: #fff;
      --text-gray: #666;
      --brand-green: #2e7d32;
      --bg-light: #f8f9fa;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #e5e9ee !important;
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
    }

    #app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* --- CHROME STYLE TOP LOADER --- */
    #top-progress-container {
      width: 100%;
      height: 4px;
      background: transparent;
      z-index: 100;
      position: relative;
      /* Fixed മാറ്റി Relative ആക്കി */
      flex: 0 0 auto;
      /* Layout-ൽ സ്ഥലം പിടിക്കാൻ */
    }

    #wiz-progress {
      background: linear-gradient(90deg, #4ade80, #2e7d32);
      height: 100%;
      width: 0%;
      border-radius: 0 4px 4px 0;
      transition: width 0.4s ease-out;
      box-shadow: 0 2px 10px rgba(46, 125, 50, 0.4);
    }

    /* NAVBAR */
    .navbar {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.98);
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
      z-index: 10;
    }

    .brand-logo-img {
      height: 38px;
      width: auto;
    }

    /* SCROLL AREA */
    .scroll-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 60px;
      -webkit-overflow-scrolling: touch;
    }

    /* --- INPUT STYLES --- */
    .huge-input {
      border: none;
      border-bottom: 2px solid #ddd;
      padding: 12px 0;
      font-size: 22px;
      font-weight: 700;
      width: 100%;
      outline: none;
      border-radius: 0;
      background: transparent;
      transition: border-color 0.3s;
      color: #333;
    }

    .huge-input:focus {
      border-color: var(--brand-green);
    }

    select.huge-input {
      border: 1px solid #ddd !important;
      border-radius: 8px !important;
      padding: 10px;
      margin-top: 5px;
    }

    .regular-input {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-weight: 600;
      outline: none;
      background: #fff;
      font-size: 14px;
    }

    .regular-input:focus {
      border-color: var(--brand-green);
    }

    .form-label {
      font-weight: 700;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
      margin-bottom: 5px;
      display: block;
    }

    /* BUTTONS */
    .btn-black {
      background: black;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-back {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: #f0f0f0;
      border: none;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- EDIT VIEW DESIGN --- */
    #returning-user-view {
      /* background-color: #f3f4f6 !important; */
      /* padding: 20px; */
      border-radius: 24px;
      margin-top: 10px;
      box-shadow: none !important;
      border: none !important;
    }

    .white-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      border: 1px solid #fff;
    }

    .welcome-header {
      font-size: 26px;
      font-weight: 800;
      color: #111;
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .badge-oid-green {
      background-color: #dcfce7;
      color: #15803d;
      font-family: monospace;
      font-size: 10px;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-block;
      border: 1px solid #bbf7d0;
    }

    .user-name-tag {
      background: #000;
      color: #fff;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-edit-capsule {
      background: #ecfdf5;
      color: #15803d;
      font-size: 10px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      display: inline-block;
    }

    .btn-edit-capsule:hover {
      background: #dcfce7;
      transform: translateY(-1px);
    }

    .addr-block {
      margin-top: 9px;
      color: #4b5563;
      font-size: 12px;
      line-height: 1.5;
      font-weight: 500;
    }

    .addr-house {
      font-weight: 800;
      color: #374151;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }

    .pin-box {
      background: #e5e7eb;
      color: #1f2937;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 10px;
      margin-left: 5px;
    }

    .phone-grey-box {
      background-color: #f4f7fa;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ph-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .qty-action-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    #quick-qty {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-weight: 700;
      padding: 0 15px;
      height: 54px;
      background: #fff;
    }

    .btn-update-sage {
      background-color: #3a9b3a !important;
      color: white;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 0 25px;
      font-size: 14px;
      height: 54px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 6px rgba(138, 182, 138, 0.2);
    }

    .price-card {
      background: #f9fafb;
      border: 1px dashed #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      color: #666;
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      color: #000;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
    }

    #returning-user-view~.footer-action {
      display: none !important;
    }

    /* --- WIZARD STYLES --- */
    #wizard-view {
      background: #fff;
      border-radius: 23px;
      padding: 20px;
      border: 1px solid #eee;
    }

    #wizard-view .form-label {
      margin-top: 0;
      margin-bottom: 0;
    }

    /* LOADER & ANIMATION */
    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modern-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top-color: var(--brand-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .step-section {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FOOTER */
    .footer-action {
      flex: 0 0 auto;
      background: white;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      z-index: 20;
    }

    /* TRACKING TIMELINE */
    .tracking-wrapper {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      border: 1px solid #eee;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .track-tl {
      position: relative;
      padding-left: 30px;
      list-style: none;
      margin: 0;
    }

    .track-tl-item {
      position: relative;
      padding-bottom: 25px;
      padding-left: 15px;
    }

    .track-tl-item:last-child {
      padding-bottom: 0;
    }

    .track-tl-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 5px;
      width: 2px;
      height: 100%;
      background: #e0e0e0;
    }

    .track-tl-item:last-child::before {
      display: none;
    }

    .track-tl-dot {
      position: absolute;
      left: -6px;
      top: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e0e0e0;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #e0e0e0;
      z-index: 1;
    }

    .track-tl-item.active .track-tl-dot {
      background: #2e7d32;
      box-shadow: 0 0 0 2px #dcfce7;
    }

    .track-tl-item.active::before {
      background: #2e7d32;
    }

    .track-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      line-height: 1.2;
    }

    .track-desc {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .track-date {
      font-size: 10px;
      color: #aaa;
      float: right;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <input type="hidden" id="order-status-hidden" value="">



  <div id="full-loader">
    <div class="loader-wrapper">
      <div class="modern-spinner"></div>
    </div>
    <p class="mt-3 fw-bold small text-muted">LOADING...</p>
  </div>

  <div id="app-layout">
    <nav class="navbar">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <img src="logo.png" alt="KAFAK" class="brand-logo-img" onerror="this.style.display='none'">
        </div>
        <select class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none"
          style="width:auto;" onchange="changeLanguage(this.value)">
          <option value="ml" selected>മലയാളം</option>
          <option value="en">ENGLISH</option>
        </select>
      </div>
    </nav>

    <div id="top-progress-container" style="display:none;">
      <div id="wiz-progress"></div>
    </div>

    <div class="scroll-content">
      <div class="container p-0" style="max-width: 500px;">

        <div id="showsuccess" class="text-center step-section" style="padding-top: 50px;">
          <div style="font-size: 60px; color: var(--brand-green);"><i class="fas fa-check-circle"></i></div>
          <h3 class="fw-bold mt-3 mb-2" data-i18n="order_success">ഓർഡർ ലഭിച്ചു!</h3>
          <p class="text-muted mb-4 small" data-i18n="redirect_wa">വാട്സാപ്പിലേക്ക് പോകുന്നു...</p>
          <button onclick="sendToWhatsapp()" class="btn-black" style="background:var(--brand-green);"><i
              class="fab fa-whatsapp"></i> <span data-i18n="open_wa">Open WhatsApp</span></button>
        </div>

        <form id="order-form" onsubmit="return false;">

          <div id="step-0" class="step-section pt-4"
            style="background:#fff; border-radius:23px; padding:24px; border:1px solid #eee;">
            <label class="form-label" data-i18n="lbl_phone" style="font-size:13px; margin-top: 0;">ഫോൺ നമ്പർ</label>
            <input type="tel" id="phone" class="huge-input" placeholder="Mobile Number" maxlength="10">
          </div>

          <div id="returning-user-view" class="step-section">

            <div class="d-flex justify-content-between align-items-start mb-3 px-1">
              <div>
                <h1 class="welcome-header" data-i18n="welcome_back">Welcome<br>Back!</h1>
              </div>
              <div class="text-end">
                <div id="display-oid" class="badge-oid-green">#ORD-...</div>
                <div id="display-date" class="text-muted fw-bold small mt-1" style="font-size:10px;">...</div>
              </div>
            </div>

            <div class="white-card">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <div id="saved-name" class="user-name-tag">NAME</div>
                <a href="#" id="btn-edit-addr" onclick="toggleAddressEdit()" class="btn-edit-capsule"
                  data-i18n="btn_edit">EDIT ADDRESS</a>
              </div>

              <div id="saved-address-text" class="addr-block"></div>

              <div id="saved-phone-text"></div>

              <div class="address-box" id="address-edit-box" style="display:none;">
                <h6 class="fw-bold small text-muted mb-3 pt-3 border-top">UPDATE DETAILS</h6>
                <div class="row g-2">
                  <div class="col-12"><input type="tel" id="edit-phone" class="regular-input" placeholder="Phone"
                      maxlength="10" oninput="updateSummaryDisplay()"></div>
                  <div class="col-12"><input type="text" id="edit-house" class="regular-input" placeholder="House Name"
                      oninput="updateSummaryDisplay()"></div>
                  <div class="col-6"><input type="text" id="edit-place" class="regular-input" placeholder="Place"
                      oninput="updateSummaryDisplay()"></div>
                  <div class="col-6"><input type="tel" id="edit-pincode" class="regular-input" placeholder="Pin"
                      maxlength="6" oninput="handleEditPincode(this.value)"></div>
                  <div class="col-12" id="edit-po-wrapper" style="display:none;">
                    <select id="edit-postoffice-select" class="regular-input"
                      onchange="selectEditPO(this.value)"></select>
                  </div>
                  <div class="col-12" id="edit-po-wrapper" style="display:none;">
                    <select id="edit-postoffice-select" class="regular-input"
                      onchange="selectEditPO(this.value)"></select>
                  </div>

                  <div id="single-po-display" class="col-12 text-success fw-bold small mt-1"
                    style="display:none; padding-left:5px; font-size:11px;"></div>
                </div>
                <input type="hidden" id="edit-postoffice"><input type="hidden" id="edit-district"><input type="hidden"
                  id="edit-state">
                <div class="row g-2 mt-2">
                  <div class="col-6"><input type="tel" id="edit-whatsapp" class="regular-input" placeholder="WhatsApp"
                      maxlength="10" oninput="updateSummaryDisplay()"></div>
                  <div class="col-6"><input type="tel" id="edit-altphone" class="regular-input" placeholder="Alt Phone"
                      maxlength="10" oninput="updateSummaryDisplay()"></div>
                </div>

                <button class="btn btn-dark w-100 mt-3 rounded-3 fw-bold py-3" onclick="submitQuickOrder()">SAVE
                  CHANGES</button>
              </div>
            </div>

            <div class="white-card">
              <label class="form-label mb-2" data-i18n="lbl_qty" style="color:#6b7280; font-size:12px;">SELECT
                QUANTITY</label>

              <div class="qty-action-row mb-3">
                <select id="quick-qty" class="form-select border-0 bg-light fw-bold" style="font-size: 16px;">
                  <option value="" disabled selected>Select...</option>
                  <!-- <option value="1">1 Bottle (650g)</option>
                  <option value="2">2 Bottles (1.30 kg)</option>
                  <option value="3">3 Bottles (1.95 kg)</option>
                  <option value="4">4 Bottles (2.60 kg)</option>
                  <option value="5">5 Bottles (3.25 kg)</option>
                  <option value="6">6 Bottles (3.90 kg)</option>
                  <option value="8">8 Bottles (5.20 kg)</option>
                  <option value="10">10 Bottles (6.50 kg)</option> -->
                </select>
                <button onclick="submitQuickOrder()" class="btn-update-sage">
                  <span data-i18n="btn_update">UPDATE ORDER</span>
                </button>
              </div>

              <div id="quick-price-box" class="price-card mb-3" style="display:none;">
                <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                      class="val-base">0</span></span></div>
                <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
                <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                      class="val-total">0</span></span></div>
              </div>

              <div class="platinum-badge" id="offer-badge" style="display:none;">
                <i class="fas fa-crown"></i> <span>Platinum Customer</span>
              </div>

              <div id="status-area" class="mt-3"></div>
            </div>
          </div>

          <div id="wizard-view" class="step-section">
            <div class="wiz-step" data-step="1"><label class="form-label" data-i18n="lbl_name">നിങ്ങളുടെ
                പേര്</label><input type="text" id="name" class="huge-input" placeholder="Name" autofocus></div>
            <div class="wiz-step" data-step="2" style="display:none;"><label class="form-label"
                data-i18n="lbl_whatsapp">വാട്സാപ്പ് നമ്പർ</label><input type="tel" id="whatsapp" class="huge-input"
                placeholder="WhatsApp" maxlength="10"></div>
            <div class="wiz-step" data-step="3" style="display:none;"><label class="form-label"
                data-i18n="lbl_pincode">പിൻകോഡ്</label><input type="tel" id="pincode" class="huge-input" maxlength="6"
                placeholder="000000" oninput="this.value = this.value.replace(/[^0-9]/g, '')"></div>
            <div class="wiz-step" data-step="3.5" style="display:none;"><label class="form-label"
                data-i18n="lbl_select_po">പോസ്റ്റ് ഓഫീസ് തിരഞ്ഞെടുക്കുക</label><select id="po-select"
                class="huge-input">
                <option value="">Select...</option>
              </select></div>
            <div class="wiz-step" data-step="4" style="display:none;"><label class="form-label"
                data-i18n="lbl_house">വീട്ടുപേര് / നമ്പർ</label><input type="text" id="house" class="huge-input"
                placeholder="House Name"></div>
            <div class="wiz-step" data-step="5" style="display:none;">
              <label class="form-label" data-i18n="lbl_place">സ്ഥലം</label>
              <input type="text" id="place" class="huge-input" placeholder="Place" list="place-list"><datalist
                id="place-list"></datalist>
            </div>
            <div class="wiz-step" data-step="6" style="display:none;"><label class="form-label"
                data-i18n="lbl_altphone">മറ്റൊരു നമ്പർ (Optional)</label><input type="tel" id="altphone"
                class="huge-input" placeholder="Alternate Phone" maxlength="10"></div>
            <div class="wiz-step" data-step="7" style="display:none;">
              <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
              <select id="quantity" class="huge-input">
                <option value="" disabled selected>Select...</option>
              </select>
              <div id="wiz-price-box" class="price-card" style="display:none; background:#fff; border:1px solid #eee;">
                <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                      class="val-base">0</span></span></div>
                <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
                <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                      class="val-total">0</span></span></div>
              </div>
              <div id="wiz-deliver-box" class="mt-3 p-3 bg-white border rounded"
                style="display:none; border-left:4px solid black !important;">
                <div id="wiz-final-addr" style="font-size:13px; line-height:1.4;"></div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="footer-action">
      <div class="container p-0" style="max-width: 500px;">
        <div id="btn-group-0" style="display:none;"><button type="button" class="btn-black"
            onclick="handlePhoneNext()"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-wizard" style="display:none;"><button type="button" class="btn-back" onclick="prevStep()"><i
              class="fas fa-chevron-left"></i></button><button type="button" class="btn-black flex-grow-1 ms-3"
            onclick="nextStep()" id="btn-wiz-next"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-returning" style="display:none !important;"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
