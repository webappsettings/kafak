<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>KAFAK | Premium Honey</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #000;
      --secondary: #fff;
      --text-gray: #666;
      --brand-green: #2e7d32;
      --bg-light: #f8f9fa;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--secondary);
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
    }

    #app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* NAVBAR */
    .navbar {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.98);
      padding: 15px 0;
      border-bottom: 1px solid #f0f0f0;
      z-index: 10;
    }

    .brand-logo-img {
      height: 38px;
      width: auto;
    }

    /* SCROLL AREA */
    .scroll-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 60px;
      -webkit-overflow-scrolling: touch;
    }

    /* --- OLD STYLE INPUTS (For Wizard - Create View) --- */
    .huge-input {
      border: none;
      border-bottom: 2px solid #ddd;
      padding: 12px 0;
      font-size: 22px;
      font-weight: 700;
      width: 100%;
      outline: none;
      border-radius: 0;
      background: transparent;
      transition: border-color 0.3s;
      color: #333;
    }

    .huge-input:focus {
      border-color: var(--brand-green);
    }

    /* Wizard Select Fix */
    select.huge-input {
      border: 1px solid #ddd !important;
      border-radius: 8px !important;
      padding: 10px;
      margin-top: 5px;
    }

    /* --- NEW STYLE INPUTS (For Edit View) --- */
    .regular-input {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 9px;
      width: 100%;
      font-weight: 600;
      outline: none;
      background: #fff;
    }

    .regular-input:focus {
      border-color: var(--brand-green);
    }

    .form-label {
      font-weight: 700;
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 15px;
      margin-bottom: 5px;
      display: block;
    }

    /* BUTTONS */
    .btn-black {
      background: black;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-brand-green {
      background: var(--brand-green) !important;
    }

    .btn-back {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: #f0f0f0;
      border: none;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* EDIT CARD (PROFESSIONAL STYLE) */
    .summary-card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #f0f0f0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
      position: relative;
    }

    .user-name-title {
      font-size: 20px;
      font-weight: 800;
      color: #000;
      margin-bottom: 5px;
    }

    .address-text {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .phone-row {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      background: #f5f5f5;
      padding: 8px 12px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .edit-link {
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-green);
      text-transform: uppercase;
      cursor: pointer;
      background: #e8f5e9;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .address-box {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px dashed #eee;
    }

    /* PRICE CARD */
    .price-card {
      background: #fff;
      border: 1px dashed #ccc;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      color: #666;
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      color: #000;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
    }

    /* HEADER META (Right Side Date) */
    /* HEADER META STYLES */
    .header-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      /* Aligns text neatly */
      margin-bottom: 20px;
      padding: 0 2px;
    }

    .welcome-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #000;
      line-height: 1;
    }

    .meta-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      /* Forces right alignment */
    }

    .oid-pill {
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-green);
      background: #e8f5e9;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #c8e6c9;
      margin-bottom: 4px;
      /* Gap between ID and Date */
    }

    .date-text {
      font-size: 10px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- NEW LOADER STYLE --- */
    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-wrapper {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modern-spinner {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid #f0f0f0;
      border-top-color: var(--brand-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .count-text {
      font-size: 16px;
      font-weight: 800;
      color: var(--brand-green);
      font-family: 'Manrope', sans-serif;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .step-section {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* SWEETALERT */
    .ios-popup {
      border-radius: 20px !important;
      font-family: 'Manrope', sans-serif !important;
    }

    .ios-btn {
      border-radius: 10px !important;
      background: black !important;
      color: white !important;
    }

    .ios-btn-cancel {
      border-radius: 10px !important;
      background: #eee !important;
      color: #333 !important;
    }

    /* FOOTER */
    .footer-action {
      flex: 0 0 auto;
      background: white;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      z-index: 20;
    }

    /* --- TIMELINE TRACKING STYLE --- */
    .tracking-wrapper {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      border: 1px solid #eee;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .track-tl {
      position: relative;
      padding-left: 30px;
      list-style: none;
      margin: 0;
    }

    .track-tl-item {
      position: relative;
      padding-bottom: 25px;
      padding-left: 15px;
    }

    .track-tl-item:last-child {
      padding-bottom: 0;
    }

    /* Vertical Line */
    .track-tl-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 5px;
      width: 2px;
      height: 100%;
      background: #e0e0e0;
    }

    .track-tl-item:last-child::before {
      display: none;
    }

    /* The Dot */
    .track-tl-dot {
      position: absolute;
      left: -6px;
      top: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e0e0e0;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #e0e0e0;
      z-index: 1;
    }

    /* Active State (Green) */
    .track-tl-item.active .track-tl-dot {
      background: #2e7d32;
      box-shadow: 0 0 0 2px #dcfce7;
    }

    .track-tl-item.active::before {
      background: #2e7d32;
      /* Green Line for finished steps */
    }

    .track-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      line-height: 1.2;
    }

    .track-desc {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .track-date {
      font-size: 10px;
      color: #aaa;
      float: right;
      font-weight: 600;
    }

    /* --- BEAUTIFUL BACKGROUND UPDATE --- */
    body {
      background-color: #f0f2f5 !important;
      /* Modern Light Gray */
    }

    /* Main Content Card Style */
    #returning-user-view,
    #wizard-view,
    .login-card {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      /* Soft Shadow for depth */
      margin-top: 20px;
      margin-bottom: 30px;
      border: 1px solid #fff;
    }

    /* Mobile Adjustment */
    @media (max-width: 576px) {
      body {
        background-color: #f8f9fa !important;
        /* Lighter gray for mobile */
      }

      #returning-user-view,
      #wizard-view {
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        margin-top: 10px;
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>

  <div id="full-loader">
    <div class="loader-wrapper">
      <div class="modern-spinner"></div>
      <div class="count-text" id="loader-percent">0%</div>
    </div>
    <p class="mt-3 fw-bold small text-muted" id="loader-text" style="letter-spacing:1px;">LOADING...</p>
  </div>

  <div id="app-layout">
    <nav class="navbar">
      <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
          <img src="logo.png" alt="KAFAK" class="brand-logo-img" onerror="this.style.display='none'">
        </div>
        <select class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none"
          style="width:auto;" onchange="changeLanguage(this.value)">
          <option value="ml" selected>മലയാളം</option>
          <option value="en">ENGLISH</option>
        </select>
      </div>
    </nav>

    <div class="scroll-content">
      <div class="container p-0" style="max-width: 500px;">

        <div id="showsuccess" class="text-center step-section" style="padding-top: 50px;">
          <div style="font-size: 60px; color: var(--brand-green);"><i class="fas fa-check-circle"></i></div>
          <h3 class="fw-bold mt-3 mb-2" data-i18n="order_success">ഓർഡർ ലഭിച്ചു!</h3>
          <p class="text-muted mb-4 small" data-i18n="redirect_wa">വാട്സാപ്പിലേക്ക് പോകുന്നു...</p>
          <button onclick="sendToWhatsapp()" class="btn-black" style="background:var(--brand-green);"><i
              class="fab fa-whatsapp"></i> <span data-i18n="open_wa">Open WhatsApp</span></button>
        </div>

        <form id="order-form" onsubmit="return false;">

          <div id="step-0" class="step-section pt-4">
            <label class="form-label" data-i18n="lbl_phone" style="font-size:13px;">ഫോൺ നമ്പർ</label>
            <input type="tel" id="phone" class="huge-input" placeholder="Mobile Number" maxlength="10">
          </div>

          <div id="returning-user-view" class="step-section">

            <div class="header-meta">
              <div class="welcome-text" data-i18n="welcome_back">സ്വാഗതം!</div>

              <div class="meta-right">
                <div id="display-oid" class="oid-pill"></div>
                <div id="display-date" class="date-text"></div>
              </div>
            </div>

            <div class="summary-card">
              <div class="d-flex justify-content-between align-items-start">
                <div class="user-name-title" id="saved-name"></div>
                <div class="edit-link" id="btn-edit-address" onclick="toggleAddressEdit()" data-i18n="btn_edit">മാറ്റാം
                  <i class="fas fa-pen"></i>
                </div>
              </div>

              <div class="address-text" id="saved-address-text"></div>

              <div class="phone-row" id="saved-phone-text"></div>

              <div class="address-box" id="address-edit-box">
                <label class="form-label" data-i18n="lbl_phone">Phone</label>
                <input type="tel" id="edit-phone" class="regular-input mb-2" maxlength="10"
                  oninput="updateSummaryDisplay()">
                <label class="form-label" data-i18n="lbl_house">House</label>
                <input type="text" id="edit-house" class="regular-input mb-2" oninput="updateSummaryDisplay()">
                <div class="row g-2">
                  <div class="col-6"><label class="form-label" data-i18n="lbl_place">Place</label><input type="text"
                      id="edit-place" class="regular-input mb-2" oninput="updateSummaryDisplay()"></div>
                  <div class="col-6"><label class="form-label" data-i18n="lbl_pincode">Pin</label><input type="tel"
                      id="edit-pincode" class="regular-input mb-2" maxlength="6"
                      oninput="handleEditPincode(this.value)"></div>
                </div>
                <div id="edit-po-wrapper" style="display:none;"><label class="form-label">Post Office</label><select
                    id="edit-postoffice-select" class="regular-input mb-2" onchange="selectEditPO(this.value)"></select>
                </div>
                <input type="hidden" id="edit-postoffice"><input type="hidden" id="edit-district"><input type="hidden"
                  id="edit-state">
                <label class="form-label" data-i18n="lbl_whatsapp">WhatsApp</label><input type="tel" id="edit-whatsapp"
                  class="regular-input mb-2" maxlength="10" oninput="updateSummaryDisplay()">
                <label class="form-label" data-i18n="lbl_altphone">Alt Phone</label><input type="tel" id="edit-altphone"
                  class="regular-input mb-2" maxlength="10" oninput="updateSummaryDisplay()">
              </div>
            </div>

            <div class="mt-4">
              <label class="form-label qty-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
              <select id="quick-qty" class="regular-input" style="font-size:16px;">
                <option value="" disabled selected>Select...</option>
              </select>

              <div id="quick-price-box" class="price-card" style="display:none;">
                <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                      class="val-base">0</span></span></div>
                <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
                <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                      class="val-total">0</span></span></div>
              </div>

              <div id="status-area" class="mt-3"></div>
            </div>
          </div>

          <div id="wizard-view" class="step-section">
            <div style="height:3px; background:#f0f0f0; width:100%; margin-bottom:25px; border-radius:2px;">
              <div id="wiz-progress"
                style="height:100%; background:var(--brand-green); width:10%; transition:width 0.3s ease;"></div>
            </div>

            <div class="wiz-step" data-step="1"><label class="form-label" data-i18n="lbl_name">നിങ്ങളുടെ
                പേര്</label><input type="text" id="name" class="huge-input" placeholder="Name" autofocus></div>
            <div class="wiz-step" data-step="2" style="display:none;"><label class="form-label"
                data-i18n="lbl_whatsapp">വാട്സാപ്പ് നമ്പർ</label><input type="tel" id="whatsapp" class="huge-input"
                placeholder="WhatsApp" maxlength="10"></div>
            <div class="wiz-step" data-step="3" style="display:none;"><label class="form-label"
                data-i18n="lbl_pincode">പിൻകോഡ്</label><input type="tel" id="pincode" class="huge-input" maxlength="6"
                placeholder="000000"></div>
            <div class="wiz-step" data-step="3.5" style="display:none;"><label class="form-label"
                data-i18n="lbl_select_po">പോസ്റ്റ് ഓഫീസ് തിരഞ്ഞെടുക്കുക</label><select id="po-select"
                class="huge-input">
                <option value="">Select...</option>
              </select></div>
            <div class="wiz-step" data-step="4" style="display:none;"><label class="form-label"
                data-i18n="lbl_house">വീട്ടുപേര് / നമ്പർ</label><input type="text" id="house" class="huge-input"
                placeholder="House Name"></div>
            <div class="wiz-step" data-step="5" style="display:none;">
              <label class="form-label" data-i18n="lbl_place">സ്ഥലം</label>
              <input type="text" id="place" class="huge-input" placeholder="Place" list="place-list"
                oninput="updateWizardLocDisplay()">
              <datalist id="place-list"></datalist>
              <div class="mt-2 text-muted small fw-bold" id="display-po"></div>
              <div class="text-muted small" id="display-dist-state"></div>
            </div>
            <div class="wiz-step" data-step="6" style="display:none;"><label class="form-label"
                data-i18n="lbl_altphone">മറ്റൊരു നമ്പർ (Optional)</label><input type="tel" id="altphone"
                class="huge-input" placeholder="Alternate Phone" maxlength="10"></div>
            <div class="wiz-step" data-step="7" style="display:none;">
              <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
              <select id="quantity" class="huge-input">
                <option value="" disabled selected>Select...</option>
              </select>
              <div id="wiz-price-box" class="price-card" style="display:none;">
                <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                      class="val-base">0</span></span></div>
                <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
                <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                      class="val-total">0</span></span></div>
              </div>
              <div id="wiz-deliver-box" class="mt-3 p-3 bg-white border rounded"
                style="display:none; border-left:4px solid black !important;">
                <div class="small fw-bold text-muted mb-1">DELIVER TO:</div>
                <div id="wiz-final-addr" style="font-size:13px; line-height:1.4;"></div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="footer-action">
      <div class="container p-0" style="max-width: 500px;">
        <div id="btn-group-0" style="display:none;"><button type="button" class="btn-black"
            onclick="handlePhoneNext()"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-wizard" style="display:none;"><button type="button" class="btn-back" onclick="prevStep()"><i
              class="fas fa-chevron-left"></i></button><button type="button" class="btn-black flex-grow-1 ms-3"
            onclick="nextStep()" id="btn-wiz-next"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-returning" style="display:none;"><button type="button" class="btn-black btn-brand-green"
            onclick="submitQuickOrder()" id="btn-quick-submit"><span data-i18n="btn_update">ഓർഡർ ചെയ്യാം</span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="custom.js"></script>
</body>

</html>
