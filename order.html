  <style>
    /* --- CORE VARIABLES & RESET --- */
    :root {
      --primary: #000;
      --secondary: #fff;
      --text-gray: #666;
      --brand-green: #2e7d32;
      --bg-light: #f8f9fa;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #e5e9ee !important;
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
    }

    #app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* --- CHROME STYLE TOP LOADER --- */
    #top-progress-container {
      width: 100%;
      height: 4px;
      background: transparent;
      z-index: 100;
      position: relative;
      /* Fixed മാറ്റി Relative ആക്കി */
      flex: 0 0 auto;

    #wiz-progress {

      height: 100%;
      width: 0%;

      box-shadow: 0 2px 10px rgba(46, 125, 50, 0.4);

    /* NAVBAR */

      padding: 15px 0;

      z-index: 10;

    .brand-logo-img {

    }

    /* SCROLL AREA */
    .scroll-content {

      overflow-y: auto;
      padding: 20px;
      padding-bottom: 60px;
      -webkit-overflow-scrolling: touch;
    }

    /* --- INPUT STYLES --- */
    .huge-input {

      border-bottom: 2px solid #ddd;
      padding: 12px 0;

      font-weight: 700;

    select.huge-input {

    }

    .regular-input {

      border-radius: 12px;
      padding: 12px;
      width: 100%;

      outline: none;
      background: #fff;

    .regular-input:focus {

    .form-label {

      font-size: 11px;
      color: #888;
      text-transform: uppercase;

      margin-bottom: 5px;

    }

    /* BUTTONS */

      color: white;

      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;

      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-back {

      height: 54px;
      border-radius: 12px;
      background: #f0f0f0;
      border: none;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- EDIT VIEW DESIGN --- */
    #returning-user-view {
      /* background-color: #f3f4f6 !important; */
      /* padding: 20px; */
      border-radius: 24px;
      margin-top: 10px;
      box-shadow: none !important;
      border: none !important;
    }

    .white-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      border: 1px solid #fff;
    }

    .welcome-header {

      font-weight: 800;
      color: #111;
      line-height: 1.1;
      letter-spacing: -0.5px;

    }

    .badge-oid-green {

      color: #15803d;

      padding: 6px 12px;

    .user-name-tag {

      color: #fff;

      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-edit-capsule {
      background: #ecfdf5;
      color: #15803d;
      font-size: 10px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 50px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;

    }

    .btn-edit-capsule:hover {

    }

    .addr-block {
      margin-top: 9px;
      color: #4b5563;
      font-size: 12px;
      line-height: 1.5;

    }

    .addr-house {
      font-weight: 800;
      color: #374151;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }

    .pin-box {
      background: #e5e7eb;
      color: #1f2937;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 10px;
      margin-left: 5px;
    }

    .phone-grey-box {
      background-color: #f4f7fa;
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ph-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    .qty-action-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }

    #quick-qty {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-weight: 700;
      padding: 0 15px;
      height: 54px;
      background: #fff;
    }

    .btn-update-sage {
      background-color: #3a9b3a !important;
      color: white;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      padding: 0 25px;
      font-size: 14px;
      height: 54px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 6px rgba(138, 182, 138, 0.2);
    }

    .price-card {
      background: #f9fafb;
      border: 1px dashed #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
      color: #666;
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      color: #000;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
    }

    #returning-user-view~.footer-action {
      display: none !important;
    }

    /* --- WIZARD STYLES --- */
    #wizard-view {
      background: #fff;
      border-radius: 23px;
      padding: 20px;
      border: 1px solid #eee;
    }

    #wizard-view .form-label {
      margin-top: 0;
      margin-bottom: 0;
    }

    /* --- 🔥 NEW HONEY DROP LOADER --- */
    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    /* തേൻ തുള്ളിയുടെ ഡിസൈൻ */
    .honey-drop {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ffca28, #ff6f00);
      /* Golden Honey Color */
      border-radius: 50% 0 50% 50%;
      /* തുള്ളിയുടെ ഷേപ്പ് */
      transform: rotate(-45deg);
      box-shadow: 0 5px 20px rgba(255, 111, 0, 0.4);
      animation: honey-pulse 1.2s ease-in-out infinite;
      position: relative;
    }

    /* തിളക്കം (Shine) */
    .honey-drop::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      top: 10px;
      left: 10px;
    }

    @keyframes honey-pulse {
      0% {
        transform: rotate(-45deg) scale(0.95);
        opacity: 0.9;
      }

      50% {
        transform: rotate(-45deg) scale(1.1);
        opacity: 1;
        box-shadow: 0 10px 30px rgba(255, 111, 0, 0.6);
      }

      100% {
        transform: rotate(-45deg) scale(0.95);
        opacity: 0.9;
      }
    }

    /* ടെക്സ്റ്റ് സ്റ്റൈൽ */
    #loader-text {
      margin-top: 25px;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #ff8f00;
      /* Honey Text Color */
      text-transform: uppercase;
      animation: fadeInText 1s infinite alternate;
    }

    @keyframes fadeInText {
      from {
        opacity: 0.6;
      }

      to {
        opacity: 1;
      }
    }

    .step-section {
      display: none;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* FOOTER */
    .footer-action {
      flex: 0 0 auto;
      background: white;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      z-index: 20;
    }

    /* TRACKING TIMELINE */
    .tracking-wrapper {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #eee;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .track-tl {
      position: relative;
      padding-left: 30px;
      list-style: none;
      margin: 0;
    }

    .track-tl-item {
      position: relative;
      padding-bottom: 25px;
      padding-left: 15px;
    }

    .track-tl-item:last-child {
      padding-bottom: 0;
    }

    .track-tl-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 5px;
      width: 2px;
      height: 100%;
      background: #e0e0e0;
    }

    .track-tl-item:last-child::before {
      display: none;
    }

    .track-tl-dot {
      position: absolute;
      left: -6px;
      top: 0;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e0e0e0;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #e0e0e0;
      z-index: 1;
    }

    .track-tl-item.active .track-tl-dot {
      background: #2e7d32;
      box-shadow: 0 0 0 2px #dcfce7;
    }

    .track-tl-item.active::before {
      background: #2e7d32;
    }

    .track-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      line-height: 1.2;
    }

    .track-desc {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .track-date {
      font-size: 10px;
      color: #aaa;
      float: right;
      font-weight: 600;
    }
  </style>
</head>

                placeholder="000000" oninput="this.value = this.value.replace(/[^0-9]/g, '')"></div>
            <div class="wiz-step" data-step="3.5" style="display:none;"><label class="form-label"
                data-i18n="lbl_select_po">പോസ്റ്റ് ഓഫീസ് തിരഞ്ഞെടുക്കുക</label><select id="po-select"
                class="huge-input">
                <option value="">Select...</option>
              </select></div>
            <div class="wiz-step" data-step="4" style="display:none;"><label class="form-label"
                data-i18n="lbl_house">വീട്ടുപേര് / നമ്പർ</label><input type="text" id="house" class="huge-input"
                placeholder="House Name"></div>
            <div class="wiz-step" data-step="5" style="display:none;">

              <input type="text" id="place" class="huge-input" placeholder="Place" list="place-list"><datalist
                id="place-list"></datalist>
            </div>
            <div class="wiz-step" data-step="6" style="display:none;"><label class="form-label"
                data-i18n="lbl_altphone">മറ്റൊരു നമ്പർ (Optional)</label><input type="tel" id="altphone"
                class="huge-input" placeholder="Alternate Phone" maxlength="10"></div>
            <div class="wiz-step" data-step="7" style="display:none;">
              <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
              <select id="quantity" class="huge-input">
                <option value="" disabled selected>Select...</option>
              </select>
              <div id="wiz-price-box" class="price-card" style="display:none; background:#fff; border:1px solid #eee;">
                <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                      class="val-base">0</span></span></div>
                <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
                <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                      class="val-total">0</span></span></div>
              </div>
              <div id="wiz-deliver-box" class="mt-3 p-3 bg-white border rounded"
                style="display:none; border-left:4px solid black !important;">
                <div id="wiz-final-addr" style="font-size:13px; line-height:1.4;"></div>
              </div>
            </div>
          </div>

        </form>
      </div>
    </div>

    <div class="footer-action">
      <div class="container p-0" style="max-width: 500px;">
        <div id="btn-group-0" style="display:none;"><button type="button" class="btn-black"
            onclick="handlePhoneNext()"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-wizard" style="display:none;"><button type="button" class="btn-back" onclick="prevStep()"><i
              class="fas fa-chevron-left"></i></button><button type="button" class="btn-black flex-grow-1 ms-3"
            onclick="nextStep()" id="btn-wiz-next"><span data-i18n="btn_next">തുടരുക</span></button></div>
        <div id="btn-group-returning" style="display:none !important;"></div>
      </div>
    </div>

  <script>
    // Monitor styling to show progress bar only when Wizard is visible
    setInterval(function () {

        $('#top-progress-container').show();
      } else {
        $('#top-progress-container').hide();

  <style>
    /* Modern Timeline CSS */
    .modern-timeline {
      padding-left: 10px;
    }

    .timeline-row {
      display: flex;
      gap: 15px;
    }

    .timeline-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 24px;
    }

    .timeline-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e5e7eb;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px #e5e7eb;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .timeline-icon.active {
      background: #10b981;
      /* Green Tick Background */
      box-shadow: 0 0 0 4px #d1fae5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .timeline-line {
      flex-grow: 1;
      width: 2px;
      background: #e5e7eb;
      margin-top: 5px;
      margin-bottom: 5px;
    }

    .timeline-line.active {
      background: #10b981;
      /* Green Line */
    }

    .timeline-right {
      flex-grow: 1;
    }

    .timeline-row.completed .timeline-right .fw-bold {
      color: #064e3b !important;
      /* Dark Green Text */
    }

    /* 🔥 MODERN SMOOTH HOURGLASS LOADER */
    .hourglass-container {
      position: relative;
      width: 40px;
      height: 40px;
      margin-bottom: 15px;
    }

    .hourglass-glass {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-top: 18px solid #2e7d32;
      /* Brand Green */
      border-bottom: 18px solid #2e7d32;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      animation: hourglass-spin 2s infinite ease-in-out;
    }

    @keyframes hourglass-spin {
      0% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(180deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* 🔥 Refund Specific Styles */
    .timeline-icon.refunded {
      background: #dc2626 !important;
      /* Red */
      box-shadow: 0 0 0 4px #fee2e2 !important;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .timeline-row.refunded-text .fw-bold {
      color: #dc2626 !important;
      /* Red Text */
    }


    /* Radio Button Animation */
    .radio-holder {
      position: relative;
      display: inline-block;
      width: 24px;
      height: 24px;
    }

    .spinner-ring {
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top: 3px solid #2563eb;
      /* Blue Loading */
      border-radius: 50%;
      animation: radio-spin 0.8s linear infinite;
      pointer-events: none;
    }

    .success-tick {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #16a34a;
      /* Green Success */
      font-size: 18px;
      font-weight: bold;
      animation: popIn 0.3s ease-out forwards;
      pointer-events: none;
      background: white;
      border-radius: 50%;
    }

    @keyframes radio-spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes popIn {
      0% {
        transform: translate(-50%, -50%) scale(0);
      }

      80% {
        transform: translate(-50%, -50%) scale(1.2);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Video Modal CSS (If needed) */
    #videoModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .video-container {
      position: relative;
      width: 320px;
      height: 576px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid #333;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .digital-label {
      position: absolute;
      top: 67%;
      left: 53%;
      transform: translate(-30%, -50%) scale(0.7);
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 40%, #ffe6a0 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .digital-label.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .content-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.8s ease-in-out;
    }

    .digital-label img {
      width: 60px;
      opacity: 0.95;
      margin-bottom: 2px;
    }

    .packed-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      color: #5d4037;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
    }

    .digital-label.final-state .content-group {
      transform: translateY(-18px) scale(0.9);
    }

    .check-wrapper {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
    }

    .check-wrapper.show {
      transform: translateX(-50%) scale(1);
    }

    .checkmark-svg {
      width: 28px;
      height: 28px;
      stroke: #28a745;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      transition: stroke-dashoffset 0.4s ease-in-out;
    }

    .check-wrapper.draw .checkmark-svg {
      stroke-dashoffset: 0;
    }

    .name-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 999;
      transform: translate(-100%, -250%) scale(1.2);
      opacity: 0;
      transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .user-name {
      font-family: 'Courier New', monospace;
      font-size: 25px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      padding-bottom: 2px;
      background-color: #000000;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-width: 163px;
      padding-left: 15px;
      padding-right: 15px;
      padding-top: 2px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .name-wrapper.show-big {
      opacity: 1;
      transform: translate(-50%, -250%) scale(1.2);
    }

    .name-wrapper.docked {
      top: 67%;
      left: 53%;
      transform: translate(-50%, 2px) scale(0.5);
      opacity: 1;
    }

    .loading-txt {
      color: #d4a017;
      margin-top: 20px;
      font-family: sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.8;
    }
  </style>
