<!DOCTYPE html>
<html lang="ml">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KAFAK | Premium Honey</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+Malayalam:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #1a1a1a;
      --secondary: #ffffff;
      --accent: #2e7d32;
      /* Brand Green */
      --bg-light: #f8f9fa;
      --border-color: #eeeeee;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Manrope', 'Noto Sans Malayalam', sans-serif;
      color: var(--primary);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 🟢 NAVBAR */
    .navbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
      z-index: 100;
    }

    .brand-logo-img {
      height: 28px;
      width: auto;
    }

    /* 🟢 SCROLL CONTENT */
    .scroll-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 80px;
      /* Space for footer */
      -webkit-overflow-scrolling: touch;
    }

    /* 🟢 CARDS */
    .summary-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid white;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }

    /* Address Compact Styles */
    .user-name-title {
      font-size: 18px;
      font-weight: 800;
      color: #000;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .address-text {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      font-weight: 500;
    }

    .phone-row {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f5f5f5;
      padding: 8px 12px;
      border-radius: 10px;
      width: fit-content;
    }

    /* Offer Badge */
    .offer-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: linear-gradient(135deg, #FFD700, #FFC107);
      color: #856404;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 12px;
      border-bottom-left-radius: 15px;
      box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.1);
    }

    /* Edit Link */
    .edit-link {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 20px;
      background: #e8f5e9;
      transition: 0.2s;
      display: inline-block;
      margin-left: auto;
    }

    .edit-link:active {
      transform: scale(0.95);
    }

    /* 🟢 INPUTS */
    .huge-input {
      border: none;
      border-bottom: 2px solid #ddd;
      padding: 15px 0;
      font-size: 22px;
      font-weight: 700;
      width: 100%;
      background: transparent;
      outline: none;
      border-radius: 0;
      transition: 0.3s;
    }

    .huge-input:focus {
      border-color: var(--primary);
    }

    .regular-input {
      border: 1px solid #e0e0e0;
      background: #f9f9f9;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      font-weight: 600;
      outline: none;
      transition: 0.3s;
    }

    .regular-input:focus {
      background: white;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
    }

    /* 🟢 BUTTONS */
    .btn-black {
      background: #111;
      color: white;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-black:active {
      transform: scale(0.98);
    }

    .btn-brand-green {
      background: var(--accent) !important;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.25);
    }

    .btn-back {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      background: #eee;
      border: none;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🟢 FOOTER */
    .footer-action {
      background: white;
      padding: 15px 20px;
      border-top: 1px solid #eee;
      flex-shrink: 0;
      z-index: 50;
    }

    /* 🟢 STATUS & DATE */
    .header-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 15px;
      padding: 0 5px;
    }

    .welcome-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .oid-pill {
      font-family: monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background: #e8f5e9;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #c8e6c9;
    }

    .date-text {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      margin-top: 4px;
    }

    /* 🟢 PRICE BOX */
    .price-card {
      background: #fff;
      border: 1px dashed #ddd;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 800;
      color: #000;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #eee;
    }

    /* 🟢 ADDRESS EDIT BOX */
    .address-box {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #eee;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: block;
    }

    /* LOADER */
    #full-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #eee;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Wizard Progress */
    #wiz-progress-bar {
      height: 4px;
      background: #f0f0f0;
      width: 100%;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    #wiz-progress {
      height: 100%;
      background: var(--accent);
      width: 10%;
      transition: width 0.3s ease;
    }

    .step-section {
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* SweetAlert Custom */
    .ios-popup {
      border-radius: 20px !important;
      font-family: 'Manrope' !important;
    }

    .ios-btn {
      background: #000 !important;
      color: #fff !important;
      border-radius: 10px !important;
    }

    .ios-btn-cancel {
      background: #f2f2f2 !important;
      color: #333 !important;
      border-radius: 10px !important;
    }
  </style>
</head>

<body>

  <div id="full-loader">
    <div class="spinner"></div>
    <p class="mt-3 fw-bold small text-muted" style="letter-spacing: 1px;">LOADING...</p>
  </div>

  <nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <img src="logo.png" alt="KAFAK" class="brand-logo-img" onerror="this.style.display='none'">
        <span class="ms-2 fw-bold" style="font-size: 18px; letter-spacing: -0.5px;">Kafak<span
            style="color:#999; font-weight:400;">Life</span></span>
      </div>
      <select class="form-select form-select-sm border-0 bg-light fw-bold text-secondary shadow-none"
        style="width:auto; font-size:12px;" onchange="changeLanguage(this.value)">
        <option value="ml" selected>മലയാളം</option>
        <option value="en">ENGLISH</option>
      </select>
    </div>
  </nav>

  <div class="scroll-content">
    <div class="container p-0" style="max-width: 480px;">

      <div id="showsuccess" class="text-center step-section" style="padding-top: 40px;">
        <div style="font-size: 60px; color: var(--accent); margin-bottom: 10px;"><i class="fas fa-check-circle"></i>
        </div>
        <h3 class="fw-bold mb-2" data-i18n="order_success">ഓർഡർ ലഭിച്ചു!</h3>
        <p class="text-muted small mb-4" data-i18n="redirect_wa">Redirecting to WhatsApp...</p>
        <button onclick="sendToWhatsapp()" class="btn-black btn-brand-green">
          <i class="fab fa-whatsapp"></i> <span data-i18n="open_wa">Open WhatsApp</span>
        </button>
      </div>

      <form id="order-form" onsubmit="return false;">

        <div id="step-0" class="step-section pt-4">
          <label class="form-label" data-i18n="lbl_phone">ഫോൺ നമ്പർ</label>
          <input type="tel" id="phone" class="huge-input" placeholder="Mobile Number" maxlength="10" autofocus>
          <div class="text-muted small mt-2">Enter your 10-digit mobile number to login.</div>
        </div>

        <div id="returning-user-view" class="step-section">

          <div class="header-meta">
            <div>
              <div class="welcome-text" data-i18n="welcome_back">സ്വാഗതം!</div>
            </div>
            <div id="display-oid" class="oid-pill"></div>
          </div>

          <div class="summary-card">
            <div id="offer-area"></div>

            <div class="d-flex justify-content-between align-items-start">
              <div class="user-name-title" id="saved-name">User</div>
              <div class="edit-link" id="btn-edit-address" onclick="toggleAddressEdit()" data-i18n="btn_edit">മാറ്റാം <i
                  class="fas fa-pencil-alt ms-1"></i></div>
            </div>

            <div class="address-text mt-1" id="saved-address-text">Fetching address...</div>

            <div class="phone-row mt-2" id="saved-phone-text">
            </div>

            <div class="address-box" id="address-edit-box">
              <label class="form-label mt-2" data-i18n="lbl_phone">Phone</label>
              <input type="tel" id="edit-phone" class="regular-input" maxlength="10" oninput="updateSummaryDisplay()">

              <label class="form-label mt-2" data-i18n="lbl_house">House</label>
              <input type="text" id="edit-house" class="regular-input" oninput="updateSummaryDisplay()">

              <div class="row g-2 mt-1">
                <div class="col-6">
                  <label class="form-label" data-i18n="lbl_place">Place</label>
                  <input type="text" id="edit-place" class="regular-input" oninput="updateSummaryDisplay()">
                </div>
                <div class="col-6">
                  <label class="form-label" data-i18n="lbl_pincode">Pincode</label>
                  <input type="tel" id="edit-pincode" class="regular-input" maxlength="6"
                    oninput="handleEditPincode(this.value)">
                </div>
              </div>

              <div id="edit-po-wrapper" class="mt-2" style="display:none;">
                <label class="form-label">Select Post Office</label>
                <select id="edit-postoffice-select" class="regular-input" onchange="selectEditPO(this.value)"></select>
              </div>

              <input type="hidden" id="edit-postoffice">
              <input type="hidden" id="edit-district">
              <input type="hidden" id="edit-state">

              <label class="form-label mt-2" data-i18n="lbl_whatsapp">WhatsApp</label>
              <input type="tel" id="edit-whatsapp" class="regular-input" maxlength="10"
                oninput="updateSummaryDisplay()">

              <label class="form-label mt-2" data-i18n="lbl_altphone">Alt Phone</label>
              <input type="tel" id="edit-altphone" class="regular-input" maxlength="10"
                oninput="updateSummaryDisplay()">
            </div>
          </div>

          <div class="mt-4">
            <label class="form-label qty-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>

            <select id="quick-qty" class="regular-input" style="font-size:16px;">
              <option value="" disabled selected>Select...</option>
            </select>

            <div id="quick-price-box" class="price-card" style="display:none;">
              <div class="price-row"><span>Honey Price (<span class="qty-count">0</span>)</span><span>₹<span
                    class="val-base">0</span></span></div>
              <div class="price-row"><span>Courier Charge</span><span>₹<span class="val-courier">0</span></span></div>
              <div class="price-total"><span>Total Amount</span><span class="text-success">₹<span
                    class="val-total">0</span></span></div>
            </div>

            <div id="status-area" class="mt-3"></div>

          </div>

        </div>

        <div id="wizard-view" class="step-section">
          <div id="wiz-progress-bar">
            <div id="wiz-progress"></div>
          </div>

          <div class="wiz-step" data-step="1">
            <label class="form-label" data-i18n="lbl_name">നിങ്ങളുടെ പേര്</label>
            <input type="text" id="name" class="huge-input" placeholder="Full Name" autofocus>
          </div>

          <div class="wiz-step" data-step="2" style="display:none;"><label class="form-label"
              data-i18n="lbl_whatsapp">വാട്സാപ്പ് നമ്പർ</label><input type="tel" id="whatsapp" class="huge-input"
              placeholder="WhatsApp" maxlength="10"></div>
          <div class="wiz-step" data-step="3" style="display:none;"><label class="form-label"
              data-i18n="lbl_pincode">പിൻകോഡ്</label><input type="tel" id="pincode" class="huge-input" maxlength="6"
              placeholder="000000"></div>
          <div class="wiz-step" data-step="3.5" style="display:none;"><label class="form-label"
              data-i18n="lbl_select_po">പോസ്റ്റ് ഓഫീസ്</label><select id="po-select"
              class="huge-input border-0 bg-transparent">
              <option value="">Select...</option>
            </select></div>
          <div class="wiz-step" data-step="4" style="display:none;"><label class="form-label"
              data-i18n="lbl_house">വീട്ടുപേര്</label><input type="text" id="house" class="huge-input"
              placeholder="House Name"></div>
          <div class="wiz-step" data-step="5" style="display:none;">
            <label class="form-label" data-i18n="lbl_place">സ്ഥലം</label>
            <input type="text" id="place" class="huge-input" placeholder="Place" list="place-list"
              oninput="updateWizardLocDisplay()">
            <datalist id="place-list"></datalist>
            <div class="mt-2 text-muted small fw-bold" id="display-po"></div>
            <div class="text-muted small" id="display-dist-state"></div>
          </div>
          <div class="wiz-step" data-step="6" style="display:none;"><label class="form-label"
              data-i18n="lbl_altphone">മറ്റൊരു നമ്പർ (Optional)</label><input type="tel" id="altphone"
              class="huge-input" placeholder="Alternate Phone" maxlength="10"></div>
          <div class="wiz-step" data-step="7" style="display:none;">
            <label class="form-label" data-i18n="lbl_qty">എത്ര ബോട്ടിൽ വേണം?</label>
            <select id="quantity" class="huge-input border-0 bg-transparent">
              <option value="" disabled selected>Select...</option>
            </select>
            <div id="wiz-price-box" class="price-card mt-3" style="display:none;">
              <div class="price-row"><span>Price (<span class="qty-count">0</span>)</span><span>₹<span
                    class="val-base">0</span></span></div>
              <div class="price-row"><span>Courier</span><span>₹<span class="val-courier">0</span></span></div>
              <div class="price-total"><span>Total</span><span class="text-success">₹<span
                    class="val-total">0</span></span></div>
            </div>
            <div id="wiz-deliver-box" class="price-card mt-3 bg-white"
              style="display:none; border-left:4px solid #000;">
              <div class="form-label mb-1">DELIVER TO:</div>
              <div id="wiz-final-addr" style="font-size:13px; line-height:1.4;"></div>
            </div>
          </div>
        </div>

      </form>
    </div>
  </div>

  <div class="footer-action">
    <div class="container p-0" style="max-width: 480px;">
      <div id="btn-group-0" style="display:none;">
        <button type="button" class="btn-black" onclick="handlePhoneNext()">
          <span data-i18n="btn_next">തുടരുക</span> <i class="fas fa-arrow-right"></i>
        </button>
      </div>

      <div id="btn-group-wizard" style="display:none; display:flex;">
        <button type="button" class="btn-back" onclick="prevStep()"><i class="fas fa-chevron-left"></i></button>
        <button type="button" class="btn-black flex-grow-1 ms-3" onclick="nextStep()" id="btn-wiz-next">
          <span data-i18n="btn_next">തുടരുക</span>
        </button>
      </div>

      <div id="btn-group-returning" style="display:none;">
        <button type="button" class="btn-black btn-brand-green" onclick="submitQuickOrder()" id="btn-quick-submit">
          <span data-i18n="btn_update">ഓർഡർ ചെയ്യാം</span>
        </button>
      </div>
    </div>
  </div>

  <div class="text-center pb-4" style="background:white;">
    <button onclick="clearMyData()" class="btn btn-sm text-muted"
      style="font-size: 10px; background:#f5f5f5; border-radius:20px; padding:5px 15px;">
      🛠️ Reset App
    </button>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="custom.js"></script>
  <script>
    function clearMyData() {
      Swal.fire({
        text: "ഹോമിലേക്ക് പോകണോ?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#000',
        cancelButtonColor: '#f2f2f2',
        confirmButtonText: 'Yes',
        customClass: { popup: 'ios-popup', confirmButton: 'ios-btn', cancelButton: 'ios-btn-cancel' }
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.removeItem('kafakCustomerData'); // Correct Key
          location.reload();
        }
      })
    }

    // Simple Language Switcher
    function changeLanguage(lang) {
      // Implement translation logic here using the 'translations' object in custom.js
      // For now, reload to apply (simplest) or use JS to update text content
      $('.form-select').val(lang);
      // Trigger update logic in custom.js if needed, or just reload for now
    }
  </script>
</body>

</html>
