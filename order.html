<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Honey Order - KAFAK LLP</title>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 600px;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      background-color: #fff;
      border-bottom: 1px solid #eee;
      border-radius: 15px 15px 0 0 !important;
      padding: 20px;
      text-align: center;
    }

    .logo-text {
      color: #d35400;
      /* Honey Color */
      font-weight: bold;
      font-size: 24px;
      margin: 0;
    }

    .form-control {
      border-radius: 8px;
      height: 45px;
      font-size: 15px;
    }

    .btn-primary {
      background-color: #d35400;
      border-color: #d35400;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      width: 100%;
    }

    .btn-primary:hover {
      background-color: #e67e22;
      border-color: #e67e22;
    }

    .error {
      color: #dc3545;
      font-size: 13px;
      margin-top: 5px;
      display: block;
    }

    /* Loader CSS */
    #main-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #d35400;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Saved Address Card */
    #saved-address-card {
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }

    #saved-address-card h5 {
      color: #e65100;
      font-size: 16px;
      margin-bottom: 5px;
    }

    #saved-address-card p {
      color: #5d4037;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="main-loader">
    <div class="spinner"></div>
    <p style="margin-top:10px; color:#666;">Loading...</p>
  </div>

  <div class="container">
    <div id="showsuccess" style="display:none; text-align:center; padding: 40px 20px;">
      <div style="font-size:60px;">✅</div>
      <h3 class="mt-3">Order Placed Successfully!</h3>
      <p class="text-muted">Thank you for ordering. You will be redirected to WhatsApp shortly.</p>
      <button class="btn btn-outline-primary mt-3" onclick="location.reload()">Place New Order</button>
    </div>

    <div class="card" id="honeyForm">
      <div class="card-header">
        <h1 class="logo-text">🍯 KAFAK HONEY</h1>
        <p class="text-muted small mb-0">Premium Quality Natural Honey</p>
      </div>

      <div class="card-body">
        <form id="order-form">

          <div id="saved-address-card" style="display:none;">
            <h5>📍 Delivering to: <span id="summary-name" style="font-weight:bold;"></span></h5>
            <p>
              <span id="summary-house"></span>, <span id="summary-place"></span><br>
              <span id="summary-post"></span>, <span id="summary-pin"></span>
            </p>
            <button type="button" class="btn btn-sm btn-outline-dark" onclick="enableEditMode()">✏️ Edit / Change
              Address</button>
          </div>

          <div id="personal-section">
            <h6 class="text-muted mb-3">👤 Personal Details</h6>

            <div class="form-group">
              <input type="text" class="form-control" name="name" id="name" placeholder="Full Name (പേര്)" required>
            </div>

            <div class="row">
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="phone" id="phone" placeholder="Phone Number" maxlength="10"
                  required>
              </div>
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="whatsapp" id="whatsapp" placeholder="WhatsApp Number"
                  maxlength="10" required>
              </div>
            </div>

            <h6 class="text-muted mb-3 mt-2">🏠 Delivery Address</h6>

            <div class="form-group">
              <input type="text" class="form-control" name="house" id="house" placeholder="House Name / No (വീട്ടുപേര്)"
                required>
            </div>

            <div class="form-group">
              <input type="text" class="form-control" name="place" id="place" placeholder="Place / Street (സ്ഥലം)"
                required>
            </div>

            <div class="row">
              <div class="col-6 form-group">
                <input type="tel" class="form-control" name="pincode" id="pincode" placeholder="Pincode" maxlength="6"
                  required>
              </div>

              <div class="col-6 form-group">
                <select class="form-control" name="officename" id="officename" style="display:none;">
                  <option value="">Select PO</option>
                </select>
                <input type="text" class="form-control" name="postoffice" id="postoffice" placeholder="Post Office"
                  style="display:none;" readonly>
              </div>
            </div>

            <div class="row pincodeEnable" style="display:none;">
              <div class="col-6 form-group">
                <input type="text" class="form-control" name="district" id="district" placeholder="District" readonly>
              </div>
              <div class="col-6 form-group">
                <input type="text" class="form-control" name="state" id="state" placeholder="State" readonly>
              </div>
            </div>
          </div>

          <div id="order-section" class="mt-4 pt-3" style="border-top: 1px dashed #ddd;">
            <h6 class="text-muted mb-3">📦 Order Items</h6>

            <div class="form-group">
              <select class="form-control" name="quantity" id="quantity" required disabled>
                <option value="">Select Quantity (എത്ര ബോട്ടിൽ വേണം?)</option>
                <option value="1">1 Bottle (650 g)</option>
                <option value="2">2 Bottles</option>
                <option value="3">3 Bottles</option>
                <option value="4">4 Bottles</option>
                <option value="5">5 Bottles</option>
                <option value="6">6 Bottles (Free Delivery)</option>
                <option value="8">8 Bottles (Free Delivery)</option>
                <option value="10">10 Bottles (Free Delivery)</option>
              </select>
            </div>

            <div class="price-show mb-3"
              style="display:none; background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #c8e6c9;">
              <p style="margin:0; font-size:14px; color:#2e7d32;" id="amt"></p>
              <h4 style="margin:5px 0 0; font-weight:bold; color:#1b5e20;" id="totalAmt"></h4>
            </div>

            <div class="form-group">
              <textarea class="form-control" name="message" id="message" rows="2"
                placeholder="Any specific instructions? (Optional)"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Place Order</button>
          </div>

        </form>
      </div>
      <div class="card-footer text-center text-muted small">
        KAFAK LLP &copy; 2026
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

  <script src="custom.js"></script>

</body>

</html>
