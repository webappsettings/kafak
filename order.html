<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Pure Honey | KAFAK</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --theme-green: #2e7d32;
      --theme-light-green: #43a047;
      --honey-gold: #f5a623;
      --soft-bg: #f1f8e9;
      /* Light Greenish Bg */
    }

    body {
      background: var(--soft-bg);
      font-family: 'Poppins', sans-serif;
      padding-top: 80px;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar-custom {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .btn-home-link {
      color: var(--theme-green);
      border: 2px solid var(--theme-green);
      border-radius: 30px;
      padding: 6px 15px;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.3s;
    }

    .btn-home-link:hover {
      background: var(--theme-green);
      color: white;
    }

    /* Card */
    .main-card {
      background: #fff;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(46, 125, 50, 0.1);
      /* Green Shadow */
      border: none;
      padding: 30px;
      margin-bottom: 40px;
    }

    /* Inputs */
    .form-control-custom {
      border-radius: 15px;
      padding: 12px 15px;
      border: 2px solid #eee;
      font-weight: 500;
      transition: all 0.3s;
    }

    .form-control-custom:focus {
      border-color: var(--theme-green);
      box-shadow: 0 0 10px rgba(46, 125, 50, 0.2);
      outline: none;
    }

    .big-input {
      height: 60px;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
    }

    /* Buttons (GREEN THEME) */
    .btn-next,
    .btn-submit {
      background: linear-gradient(45deg, var(--theme-green), var(--theme-light-green));
      border: none;
      color: white;
      font-weight: 700;
      padding: 15px;
      border-radius: 50px;
      width: 100%;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
      transition: transform 0.2s;
    }

    .btn-next:hover,
    .btn-submit:hover {
      transform: scale(1.02);
      color: white;
    }

    /* Steps & Progress */
    .step-container {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .step-container.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .progress-track {
      display: flex;
      margin-bottom: 30px;
      position: relative;
    }

    .progress-line {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      z-index: 1;
    }

    .progress-bar-custom {
      position: absolute;
      top: 15px;
      left: 0;
      height: 4px;
      background: var(--honey-gold);
      z-index: 2;
      width: 0%;
      transition: width 0.4s;
    }

    .step-dot {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #e0e0e0;
      z-index: 3;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #ccc;
      transition: all 0.4s;
    }

    .step-dot.active {
      border-color: var(--honey-gold);
      color: var(--honey-gold);
    }

    /* Gold for active step */
    .step-dot.completed {
      background: var(--theme-green);
      border-color: var(--theme-green);
      color: white;
    }

    /* Loader */
    #main-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .spinner-green {
      width: 50px;
      height: 50px;
      border: 5px solid #eee;
      border-top: 5px solid var(--theme-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Hidden Name Field Animation */
    #name-section {
      display: none;
      margin-top: 15px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-custom fixed-top">
    <div class="container">
      <a class="navbar-brand py-0" href="index.html">
        <img src="logo-order.png" alt="Kafak Logo" height="45">
      </a>
      <a href="index.html" class="btn-home-link">🏠 Home</a>
    </div>
  </nav>

  <div id="main-loader">
    <div class="spinner-green"></div>
    <p class="mt-3 fw-bold text-muted" style="color:var(--theme-green);">Loading...</p>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <div class="card main-card">

          <div class="progress-track">
            <div class="progress-line"></div>
            <div id="progressBar" class="progress-bar-custom"></div>
            <div class="flex-fill d-flex justify-content-center position-relative">
              <div id="dot-1" class="step-dot active">1</div>
            </div>
            <div class="flex-fill d-flex justify-content-center position-relative">
              <div id="dot-2" class="step-dot">2</div>
            </div>
          </div>

          <div id="showsuccess" class="text-center py-5" style="display:none;">
            <div style="font-size: 60px;">🎉</div>
            <h3 class="fw-bold text-success mt-3">Order Placed!</h3>
            <p class="text-muted">Redirecting to WhatsApp...</p>
          </div>

          <form id="order-form">

            <div id="step-1" class="step-container active">
              <div class="text-center mb-4">
                <h4 class="fw-bold" style="color:var(--theme-green);">Login / Signup</h4>
                <p class="text-muted small">Enter mobile number to continue</p>
              </div>

              <div class="mb-3">
                <input type="tel" class="form-control form-control-custom big-input" id="phone" name="phone"
                  placeholder="Mobile Number" maxlength="10" required
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              </div>

              <div id="name-section">
                <label class="form-label text-success">New here? What's your name?</label>
                <input type="text" class="form-control form-control-custom" id="name" name="name"
                  placeholder="Enter Full Name">
              </div>

              <button type="button" id="btnNext" onclick="handleStep1()" class="btn-next mt-3">
                NEXT ➔
              </button>
            </div>

            <div id="step-2" class="step-container">
              <div class="text-center mb-4">
                <h5 class="fw-bold text-muted">Delivery Details 🏠</h5>
                <small class="text-success fw-bold" id="welcome-text"></small>
              </div>

              <div class="mb-3">
                <label class="form-label">WhatsApp Number</label>
                <input type="tel" class="form-control form-control-custom" id="whatsapp" name="whatsapp"
                  placeholder="WhatsApp Number" maxlength="10" required
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              </div>

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <input type="text" class="form-control form-control-custom" id="house" name="house"
                    placeholder="House Name" required>
                </div>
                <div class="col-6">
                  <input type="text" class="form-control form-control-custom" id="place" name="place"
                    placeholder="Place" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Pincode (Auto-detects Location)</label>
                <input type="tel" class="form-control form-control-custom" id="pincode" name="pincode"
                  placeholder="6-digit PIN" maxlength="6" required
                  oninput="this.value = this.value.replace(/[^0-9]/g, '')">
              </div>

              <div class="row g-3 mb-3 pincodeEnable" style="display:none;">
                <div class="col-6">
                  <select class="form-control form-control-custom" id="officename" name="officename"
                    style="display:none;"></select>
                  <input type="text" class="form-control form-control-custom" id="postoffice" name="postoffice"
                    placeholder="Post Office" readonly>
                </div>
                <div class="col-6">
                  <input type="text" class="form-control form-control-custom" id="district" name="district"
                    placeholder="District" readonly>
                </div>
              </div>
              <input type="hidden" id="state" name="state">

              <div class="mb-4 p-3 rounded-4" style="background: #f1f8e9; border: 1px solid #c5e1a5;">
                <label class="form-label fw-bold" style="color:var(--theme-green);">Choose Quantity 👇</label>
                <select class="form-control form-control-custom" id="quantity" name="quantity" style="background:white;"
                  required disabled>
                  <option value="" selected disabled>Select Bottles</option>
                  <option value="1">1 Bottle (650g)</option>
                  <option value="2">2 Bottles (1.3 Kg)</option>
                  <option value="3">3 Bottles (1.95 Kg)</option>
                  <option value="4">4 Bottles (2.6 Kg)</option>
                  <option value="5">5 Bottles (3.25 Kg)</option>
                  <option value="6">6 Bottles (3.9 Kg)</option>
                  <option value="8">8 Bottles (5.2 Kg)</option>
                  <option value="10">10 Bottles (6.5 Kg)</option>
                </select>
                <div class="mt-3 text-end price-show" style="display:none;">
                  <div id="totalAmt" class="fw-bold text-success fs-5"></div>
                  <small class="text-muted" id="amt"></small>
                </div>
              </div>

              <div class="mb-4">
                <textarea class="form-control form-control-custom" id="message" rows="2"
                  placeholder="Any message? (Optional)"></textarea>
              </div>

              <div class="d-flex gap-3">
                <button type="button" onclick="backToStep1()"
                  class="btn btn-light flex-fill py-3 rounded-pill fw-bold border">⬅ Back</button>
                <button type="submit" id="submitBtn" class="btn-submit flex-fill py-3">
                  PLACE ORDER ✅
                </button>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="custom.js"></script>

</body>

</html>
