<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafak Admin Dashboard</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f9;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      margin-right: 5px;
    }

    .btn-scan {
      background: #007bff;
    }

    .btn-track {
      background: #6f42c1;
    }

    .btn-print {
      background: #6c757d;
    }

    .btn-whatsapp {
      background: #28a745;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .status-pending {
      color: orange;
      font-weight: bold;
    }

    .status-dispatched {
      color: #007bff;
      font-weight: bold;
    }

    /* Scanner Modal */
    #scanner-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #reader {
      width: 300px;
      background: white;
      padding: 10px;
    }

    .close-scan {
      margin-top: 20px;
      background: red;
      padding: 10px 20px;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* Print Layout (Hidden on screen) */
    @media print {
      body * {
        visibility: hidden;
      }

      #print-area,
      #print-area * {
        visibility: visible;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .print-label {
        width: 350px;
        border: 2px solid #000;
        padding: 20px;
        margin: 20px;
        page-break-inside: avoid;
        font-family: sans-serif;
      }

      .qr-code {
        float: right;
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>📦 Orders Dashboard</h2>
    <div>
      <button class="btn btn-scan" onclick="startScanner('dispatch')">📦 Scan & Dispatch</button>
      <button class="btn btn-track" onclick="startScanner('tracking')">✏️ Scan & Update Tracking</button>
    </div>
  </div>

  <div id="loader">Loading orders...</div>
  <div id="order-list"></div>

  <div id="scanner-modal">
    <div style="background:white; padding:10px; width:300px; text-align:center; border-radius:5px 5px 0 0;">
      <h3 id="scan-instruction" style="margin:0; color:#333;">Scan Order QR Code</h3>
      <p id="scan-detail" style="margin:5px 0 0; color:#666; font-size:14px;">Point camera at the Order QR</p>
    </div>

    <div id="reader"></div>
    <button class="close-scan" onclick="stopScanner()">Close Scanner</button>
  </div>

  <div id="print-area"></div>

  <script src="custom-confirm.js"></script>
</body>

</html>
